P("srlc","Shrimad Rajchandra Love and Care","Dharampur and worldwide","org","Seva","Dharampur, Gujarat · seva of Shrimad Rajchandra Mission","hands","blush",
 "Seva as a spiritual practice: a hospital, schools and an animal shelter in one of the poorest areas of South Gujarat.",
 "Inspired by Shrimad Rajchandraji and guided by Pujya Gurudevshri, Shrimad Rajchandra Love and Care is the social arm of Shrimad Rajchandra Mission Dharampur. Its 10 Care Programme covers health, education, children, women, tribal communities, animals, the environment and emergency relief. It runs a 250-bed charitable hospital in Dharampur, schools and a science college, and Jivamaitridham, an animal shelter, with an animal hospital being built. Volunteers serve from centres across the world. It has held Special Consultative Status with the UN Economic and Social Council since 2020.",
 ["A 250-bed multi-specialty charitable hospital in Dharampur","Schools, a science college and support to hundreds of rural schools","Jivamaitridham animal shelter and a mobile veterinary service","Special Consultative Status with UN ECOSOC since 2020"],
 ["Inspired and guided by","Shrimad Rajchandraji, and Pujya Gurudevshri Rakeshji"],"serve",
 [["Shrimad Rajchandra Mission Dharampur","Social initiatives: Shrimad Rajchandra Love and Care","https://www.srmd.org/social-initiatives","The full 10 Care Programme, in the Mission's own words.","Primary source"],["Shrimad Rajchandra Love and Care","Love and Care","https://loveandcare.srmd.org/","Its own site, with projects and ways to volunteer.","Primary source"]],
 null);
P("akshaya-patra","Akshaya Patra","founded 2000","org","Seva","Bengaluru · school meals for India's children","bowl","sun",
 "Began with lunch for 1,500 children in five schools, so no child would study hungry.",
 "The foundation traces its inspiration to Srila Prabhupada, the founder of ISKCON, who saw children fighting with dogs for scraps of food and asked his followers to see that no child nearby goes hungry. In 2000 Akshaya Patra began serving midday meals to 1,500 children in five schools in Bengaluru. A hot meal brought children to school and helped them stay. It grew, in partnership with the government's midday meal scheme, into large central kitchens across India, and in 2026 it passed five billion meals served.",
 ["Started in 2000 with 1,500 children in five Bengaluru schools","Feeds about 2 million children every school day","Passed 5 billion cumulative meals in 2026"],
 ["What inspired it","Srila Prabhupada, who saw hungry children and asked that none go hungry"],"higher",
 [["Akshaya Patra Foundation","History of The Akshaya Patra Foundation","https://www.akshayapatra.org/history","Year by year, from five schools to dozens of kitchens.","Institution"],W("Akshaya_Patra_Foundation")],
 null);
P("jaipur-foot","Jaipur Foot (BMVSS)","founded 1975","org","Seva","Jaipur · free artificial limbs for anyone","foot","coral",
 "A surgeon and a sculptor made a foot you can squat, run and walk barefoot in, and it is given free.",
 "In the 1960s Dr. P. K. Sethi, an orthopaedic surgeon in Jaipur, worked with Ram Chandra Sharma, a craftsman, to make an artificial foot suited to Indian life: cheap, waterproof, and good for sitting cross-legged, squatting and walking barefoot. Few people could reach it. In 1975 Devendra Raj Mehta, a civil servant, set up Bhagwan Mahaveer Viklang Sahayata Samiti to fit it free of cost. Named for Bhagwan Mahavira, it has since fitted limbs for people across India and in many countries.",
 ["The Jaipur foot was developed in the 1960s","BMVSS founded in 1975 by D. R. Mehta","Limbs are fitted and replaced free of cost"],
 ["Who started it","Dr. P. K. Sethi and Ram Chandra Sharma made the foot; D. R. Mehta founded BMVSS"],"forhigher",
 [["UNDP India","Best Foot Forward","https://www.undp.org/node/515541","How the Jaipur foot was made and who it serves, from the UN Development Programme (2025).","Institution"],W("Jaipur_foot")],
 null);
P("sewa","SEWA","founded 1972","org","Seva","Ahmedabad · union of self-employed women","thread","lilac",
 "A Gandhian lawyer organised the women no union would count, then built them their own bank.",
 "Ela Bhatt, a lawyer, headed the women's section of the Textile Labour Association in Ahmedabad, the union founded with Gandhi's guidance. She saw that women who worked for themselves, as street vendors, head-loaders, rag-pickers and home-based workers, had no protection at all. In 1972 she founded the Self-Employed Women's Association. When banks would not serve its members, they set up their own, SEWA Bank, in 1974. Bhatt received the Right Livelihood Award in 1984.",
 ["Founded in 1972 by Ela Bhatt","SEWA Bank set up in 1974 by and for its members","Right Livelihood Award, 1984"],
 ["Who started it","Ela Bhatt, shaped by Gandhi's ideas and the Textile Labour Association"],"beyond",
 [["Right Livelihood","Ela Bhatt / SEWA","https://rightlivelihood.org/?p=2676","The 1984 award, 'for helping home-based producers to organise for their welfare and self-respect'.","Institution"],W("Self_Employed_Women%27s_Association"),W("Ela_Bhatt")],
 ["We Are Poor but So Many, Ela Bhatt","Anubandh, Ela Bhatt"]);
P("goonj","Goonj","founded 1999","org","Seva","Delhi · clothing as a basic need","shirt","sky",
 "Turned the city's unused cloth into dignity, not charity.",
 "Anshu Gupta left a corporate job to start Goonj, troubled that cloth, a basic human need, was missing from development work. Goonj collects surplus clothing and material from cities and sends it to villages, not as a handout but in exchange for community work, such as repairing roads, wells and schools. It calls this putting the receiver's dignity first. Gupta received the Ramon Magsaysay Award in 2015.",
 ["Started by Anshu Gupta around 1999","Cloth for Work: material in exchange for community work","Ramon Magsaysay Award, 2015"],
 ["Who started it","Anshu Gupta"],"subtract",
 [["Goonj","Anshu Gupta, founder","https://goonj.org/profile/anshu-gupta/","Why he started, in Goonj's own words.","Institution"],W("Goonj_(NGO)")],
 null);

P("vaswani","Sadhu T. L. Vaswani","1879–1966","past","Spiritual","Hyderabad, Sindh to Pune · saint and educationist","lotus2","blush",
 "Promised his mother he would keep working; when she died, he gave his life to God and to service.",
 "Born in Hyderabad, Sindh, Thanwardas Lilaram Vaswani was a brilliant student and became a college principal. He longed to give his life to God, but his mother wanted him to succeed in the world, so he kept his promise to work while she lived. In Calcutta he found his guru, Promotholal Sen, called Naluda, and in 1910 went with him to the World Congress of Religions in Berlin. After his mother's death he renounced his career. In 1933 he opened the Mira School for Girls, beginning the Mira Movement in Education. After Partition he settled in Pune, where the Sadhu Vaswani Mission, later led by his nephew and disciple Dada J. P. Vaswani, carries on his work.",
 ["Spoke for India at the World Congress of Religions in Berlin, 1910","Founded the Mira Movement in Education in 1933","His birthday, 25 November, is observed as International Meatless Day"],
 ["His Guru","Sri Promotholal Sen, Naluda"],"mentor",
 [["Sadhu Vaswani Mission","Sadhu Vaswani","https://www.sadhuvaswani.org/sadhu-vaswani","His life, from the mission he founded.","Institution"],W("Sadhu_Vaswani")],
 ["Builders of Tomorrow, Sadhu Vaswani","India Arisen, Sadhu Vaswani"]);

P("stanford","Stanford University","founded 1885","org",ORG,"Palo Alto, California · a university born from grief","tree","mint",
 "Two parents lost their only son, and decided every child of California would be theirs.",
 "In 1884 Leland Stanford Jr. died of typhoid fever at fifteen. His grieving parents, Leland and Jane Stanford, resolved that 'the children of California shall be our children', and in 1885 founded a university in his memory on their Palo Alto farm. It opened on 1 October 1891. When Leland Sr. died in 1893 the school nearly ran out of money; Jane kept it alive with her own funds, even selling her jewellery. Decades later engineering professor Frederick Terman urged students like William Hewlett and David Packard to build companies near campus, and in 1951 opened Stanford land to technology firms. Much of Silicon Valley grew from there.",
 ["Founded in 1885 in memory of Leland Stanford Jr.","Opened on 1 October 1891","Jane Stanford sold her jewellery to keep it going","Frederick Terman, 'Father of Silicon Valley', mentored Hewlett and Packard"],
 ["Who started it","Leland and Jane Stanford; later shaped by Frederick Terman"],"beyond",
 [["Stanford University","History of Stanford","https://stanford.edu/about/history","The founding story and Jane Stanford's years, from the university itself.","Institution"],["Engineering and Technology History Wiki (IEEE)","Frederick Terman","https://ethw.org/Frederick_Terman","How a professor seeded Silicon Valley, from the IEEE history centre.","Institution"],W("History_of_Stanford_University")],
 ["Who Killed Jane Stanford?, Richard White","Making Silicon Valley, Christophe Lécuyer"]);

P("ramakrishna","Sri Ramakrishna","1836–1886","past","Spiritual","Dakshineswar, Kolkata · the Guru of Vivekananda","lotus","sun",
 "A temple priest who wept for the Divine Mother, walked many paths, and lit the fire in Vivekananda.",
 "Born in the village of Kamarpukur, Gadadhar Chattopadhyay became a priest at the Kali temple in Dakshineswar near Kolkata. His longing to see the Divine Mother was so intense that he spent nights in tears. Then, under teachers such as the Bhairavi Brahmani and the monk Totapuri, he practised one discipline after another, and also practised Islam and Christianity for a time, concluding that sincere paths lead to the same God. Young Narendranath came to him full of doubt and asked whether he had seen God. He said he had. Narendranath became Swami Vivekananda.",
 ["Priest at the Dakshineswar Kali temple from 1856","Practised many spiritual paths under different teachers","Guru of Swami Vivekananda; his words recorded in the Kathamrita, or Gospel"],
 ["His teachers","The Bhairavi Brahmani and the monk Totapuri"],"pull",
 [["Ramakrishna-Vivekananda Center","Sri Ramakrishna","https://sriramakrishna.org/sri-ramakrishna/","His life, from a centre of the Ramakrishna Order.","Institution"],W("Ramakrishna"),W("The_Gospel_of_Sri_Ramakrishna")],
 ["The Gospel of Sri Ramakrishna, M. (Mahendranath Gupta), tr. Swami Nikhilananda","Sri Ramakrishna and His Divine Play, Swami Saradananda"]);
P("yogananda","Paramahansa Yogananda","1893–1952","past","Spiritual","Gorakhpur to Los Angeles · yogi and author","infinity","lilac",
 "Searched for a Guru as a boy, found Sri Yukteswar, and carried yoga to the West.",
 "As a boy Mukunda Lal Ghosh kept running away toward the Himalayas in search of a Guru. In 1910 he met Swami Sri Yukteswar in Varanasi and trained under him for ten years, often humbled by his strict discipline. In 1920 he sailed to Boston to speak at a congress of religions and stayed in America, teaching meditation to thousands. His Autobiography of a Yogi, published in 1946, has led many readers to the spiritual life, and is free to read today.",
 ["Met his Guru, Sri Yukteswar, in 1910","Sailed to America in 1920 and founded Self-Realization Fellowship","Wrote Autobiography of a Yogi, 1946"],
 ["His Guru","Swami Sri Yukteswar Giri"],"mentor",
 [GUT(7452,"Autobiography of a Yogi, full text","His own story, including his years with Sri Yukteswar."),W("Paramahansa_Yogananda")],
 ["Autobiography of a Yogi, Paramahansa Yogananda"]);
P("vinoba","Acharya Vinoba Bhave","1895–1982","past","Spiritual","Maharashtra · walked India asking for land for the poor","shoe","mint",
 "Walked village to village asking landowners to give land to the landless, and they gave.",
 "A brilliant student who burned his school certificates, Vinoba joined Gandhi's ashram in 1916 and became one of his closest disciples. In 1940 Gandhi chose him as the first individual satyagrahi. In 1951, at a village in Telangana torn by conflict, landless families asked for land, and a landowner offered a hundred acres. That gift began the Bhoodan, land-gift, movement. For over a decade Vinoba walked across India asking landowners to share, and collected millions of acres. In 1958 he received the first Ramon Magsaysay Award for Community Leadership.",
 ["Joined Gandhi's ashram in 1916","First individual satyagrahi, 1940","Began Bhoodan in 1951 and walked India for years","First Magsaysay Award for Community Leadership, 1958"],
 ["His mentor","Mahatma Gandhi"],"subtract",
 [["Ramon Magsaysay Award Foundation","Vinoba Bhave, 1958","https://rmaward.asia/?p=2876","The citation for the first Community Leadership award.","Institution"],W("Vinoba_Bhave")],
 ["Talks on the Gita, Vinoba Bhave","Moved by Love: The Memoirs of Vinoba Bhave"]);
P("savitribai","Savitribai Phule","1831–1897","past","Leaders who gave back","Pune · India's first woman teacher","book","coral",
 "Walked to school with a spare sari, because people threw mud at her for teaching girls.",
 "Married at nine to Jyotirao Phule, Savitribai could not read. Jyotirao taught her at home and she trained as a teacher. In 1848 they opened a school for girls in Pune, among the first in India, and she taught there with her colleague Fatima Sheikh. On her way to school people threw dung and stones at her, so she carried a second sari to change into. She went on to open more schools, a home for widows, and wrote poetry. She died in 1897 after catching plague while caring for patients.",
 ["Opened a girls' school in Pune with Jyotirao Phule in 1848","Taught with Fatima Sheikh","Died in 1897 while nursing plague patients"],
 ["Her teacher","Her husband, Jyotirao Phule, who taught her to read"],"slow",
 [W("Savitribai_Phule"),W("Fatima_Sheikh")],
 ["A Forgotten Liberator: The Life and Struggle of Savitribai Phule, eds. Braj Ranjan Mani and Pamela Sardar"]);
P("faraday","Michael Faraday","1791–1867","past","Science","London · from bookbinder to the father of electromagnetism","magnet","sky",
 "A bookbinder's apprentice took notes at a lecture, and the lecturer gave him a job.",
 "Faraday had little schooling and was apprenticed to a bookbinder, where he read the books he bound. In 1812 a customer gave him tickets to Humphry Davy's lectures at the Royal Institution. He wrote careful notes, bound them, and sent them to Davy. When a laboratory assistant was dismissed in 1813, Davy recommended him, warning that science was a harsh mistress. Faraday stayed for the rest of his life, discovered electromagnetic induction, made the first electric motor and generator, and began the Christmas lectures for children.",
 ["Apprentice bookbinder with almost no formal schooling","Became Davy's assistant at the Royal Institution in 1813","Discovered electromagnetic induction in 1831","Started the Christmas lectures for young people"],
 ["His mentor","Sir Humphry Davy"],"mentor",
 [["Royal Institution","Faraday's appointment, 200 years on","https://rigb.org/node/1921","Prof Frank James, the leading Faraday scholar, on how he joined the Royal Institution.","Institution"],["MacTutor, University of St Andrews","Faraday, Michael (Dictionary of National Biography)","https://mathshistory.st-andrews.ac.uk/DNB/Faraday.html","The classic biographical entry.","Reference"],W("Michael_Faraday")],
 ["The Chemical History of a Candle, Michael Faraday","Faraday, Maxwell, and the Electromagnetic Field, Nancy Forbes and Basil Mahon"]);
P("feynman","Richard Feynman","1918–1988","past","Science","New York to Caltech · physicist and teacher","atom","sun",
 "His father taught him the difference between knowing the name of a bird and knowing the bird.",
 "Feynman's father, a uniform salesman, walked him through the woods asking not what things were called but why they behaved as they did. Feynman grew into one of the century's great physicists, sharing the 1965 Nobel Prize for quantum electrodynamics. He loved teaching, and his introductory lectures at Caltech became The Feynman Lectures on Physics, now free online. In 1986, investigating the Challenger disaster, he dipped a piece of O-ring rubber into ice water on live television to show why it failed.",
 ["Nobel Prize in Physics, 1965","His Caltech lectures became The Feynman Lectures on Physics","Showed the Challenger O-ring flaw with a glass of ice water, 1986"],
 ["His first teacher","His father, Melville Feynman"],"expt",
 [["Caltech","The Feynman Lectures on Physics, free online","https://www.feynmanlectures.caltech.edu/","The full lectures, as he gave them.","Primary source"],NOB("physics/1965/feynman/lecture/","Nobel lecture, 1965","How he really arrived at his ideas, false starts included."),W("Richard_Feynman")],
 ["Surely You're Joking, Mr. Feynman!","The Pleasure of Finding Things Out, Richard Feynman"]);
P("goodall","Jane Goodall","1934–2025","modern","Science","London to Gombe, Tanzania · primatologist","leaf","mint",
 "A young secretary with no degree went to watch chimpanzees, and changed how we see animals.",
 "As a girl Jane dreamed of Africa. Without a university degree, she worked as a secretary, saved for a passage to Kenya, and met the anthropologist Louis Leakey, who sent her in 1960 to study wild chimpanzees at Gombe. Her mother came along for the first months. She watched a chimpanzee she named David Greybeard strip leaves from a twig to fish for termites, showing that chimpanzees make tools, a discovery that startled science. She later spent decades travelling to protect animals and founded Roots & Shoots for young people.",
 ["Began studying chimpanzees at Gombe in 1960","Observed tool-making by chimpanzees","Founded the Jane Goodall Institute and Roots & Shoots"],
 ["Her mentor","Louis Leakey, and her mother Vanne, who came with her to Gombe"],"oneness",
 [["Jane Goodall's Good for All News","55 years at Gombe: Q&A with Jane","https://www.news.janegoodall.org/2015/07/20/55-years-at-gombe-qa-with-jane-on-origins-of-life-work","In her own words, on how her life's work began.","Primary source"],W("Jane_Goodall")],
 ["In the Shadow of Man, Jane Goodall","Reason for Hope, Jane Goodall"]);
P("jobs","Steve Jobs","1955–2011","modern","Engineering & tech","Cupertino, California · co-founder of Apple","quill","blush",
 "Dropped out of college, dropped in on a calligraphy class, and later put beautiful type into every computer.",
 "Adopted at birth, Jobs dropped out of Reed College after one semester and stayed on to audit classes, including calligraphy. In 1974 he travelled to India hoping to meet Neem Karoli Baba, who had died shortly before, and came back changed. He co-founded Apple in 1976, was forced out in 1985, started NeXT and helped build Pixar, then returned to Apple in 1997. In his 2005 Stanford commencement speech he told the story of connecting the dots looking backward, of love and loss, and of death.",
 ["Co-founded Apple in 1976","Forced out in 1985, returned in 1997","Travelled to India in 1974 to seek Neem Karoli Baba","Gave the 2005 Stanford commencement address"],
 ["Who shaped him","His adoptive parents, his Zen teacher Kobun Chino Otogawa, and a trip to India"],"letself",
 [["Stanford Report","'You've got to find what you love,' Jobs says: 2005 commencement address","https://news.stanford.edu/stories/2005/06/youve-got-find-love-jobs-says","The full text of his most personal speech.","Primary source"],W("Steve_Jobs")],
 ["Make Something Wonderful: Steve Jobs in His Own Words","Steve Jobs, Walter Isaacson"]);
P("chawla","Kalpana Chawla","1962–2003","modern","Engineering & tech","Karnal, Haryana to NASA · astronaut","plane","sky",
 "A girl from Karnal who studied aeronautics when few women did, and flew in space twice.",
 "Kalpana grew up in Karnal fascinated by aircraft, and studied aeronautical engineering at Punjab Engineering College, often the only woman in her class. She moved to the United States for a master's at the University of Texas at Arlington in 1984 and a PhD at Colorado. Selected as a NASA astronaut, she flew on Columbia in 1997, the first woman born in India to go to space. She died with her six crewmates when Columbia broke apart on its return on 1 February 2003.",
 ["Aeronautical engineering degree, Punjab Engineering College","Master's at UT Arlington, 1984; PhD, University of Colorado","First India-born woman in space, STS-87, 1997","Died on Columbia, STS-107, 2003"],
 ["What drove her","A childhood fascination with flight, and a family that let her study engineering"],"beyond",
 [["UTA Magazine","Remembering alumna Kalpana Chawla","https://www.uta.edu/utamagazine/archive-issues/spring_2003/alumni_notebook/chawla.html","Her university's tribute, written in 2003.","Institution"],W("Kalpana_Chawla")],
 ["Kalpana Chawla: A Life, Anil Padmanabhan"]);
P("katherine-johnson","Katherine Johnson","1918–2020","modern","Science","White Sulphur Springs to NASA Langley · mathematician","compass","lilac",
 "The astronaut said: if she says the numbers are good, I'm ready to go.",
 "Katherine Johnson finished high school at fourteen. At West Virginia State, the mathematician W. W. Schieffelin Claytor designed advanced courses just for her. In the 1950s she joined the Langley laboratory as one of the Black women 'computers' working in a segregated unit. She calculated trajectories for America's first human spaceflights, and in 1962 John Glenn asked that she personally check the electronic computer's numbers before his orbital flight. Her work contributed to the Moon landings. She received the Presidential Medal of Freedom in 2015.",
 ["Graduated high school at fourteen","Calculated trajectories for Mercury flights","John Glenn asked her to verify his 1962 orbit","Presidential Medal of Freedom, 2015"],
 ["Her mentor","Mathematician W. W. Schieffelin Claytor"],"positive",
 [["NASA Science","Katherine Johnson","https://science.nasa.gov/people/katherine-johnson","NASA's own profile of her life and work.","Institution"],W("Katherine_Johnson")],
 ["My Remarkable Journey, Katherine Johnson","Hidden Figures, Margot Lee Shetterly"]);
P("montessori","Maria Montessori","1870–1952","past","Leaders who gave back","Rome, and later Adyar, India · physician and educator","house","sun",
 "Watched children in a poor Rome tenement teach themselves, and changed how the world teaches.",
 "One of the first women to qualify as a doctor in Italy, Montessori worked with children with disabilities and saw how much they could learn with the right materials. On 6 January 1907 she opened the Casa dei Bambini, a children's house, in the San Lorenzo slum of Rome. Children chose their own work, cared for their room and concentrated deeply. Her method spread across the world. During the Second World War she lived in India, training teachers there, and her son Mario worked beside her.",
 ["Among the first women physicians in Italy","Opened the first Casa dei Bambini in Rome, 1907","Spent the war years in India, training teachers"],
 ["What taught her","Watching the children themselves"],"cultivate",
 [GUT(39863,"The Montessori Method, Maria Montessori","Her own account of the first children's houses."),W("Maria_Montessori")],
 ["The Montessori Method, Maria Montessori","The Absorbent Mind, Maria Montessori"]);

P("apollo","The Apollo program","1961–1972","org",ORG,"Houston, Cape Canaveral and beyond · humans to the Moon","moon","lilac",
 "A whole nation chose a goal 'because it is hard', and reached the Moon in eight years.",
 "In 1961 President Kennedy asked Congress to land a man on the Moon before the decade was out. At Rice University on 12 September 1962 he explained why: we choose to go to the Moon not because it is easy, but because it is hard. Hundreds of thousands of engineers, scientists, seamstresses and technicians worked on it. On 20 July 1969, Apollo 11 landed. In 1970, when an oxygen tank exploded on Apollo 13, the team on the ground improvised a way to bring the crew home alive.",
 ["Goal set in 1961","Apollo 11 landed on the Moon on 20 July 1969","Apollo 13 crew brought home safely in 1970","Six crewed landings by 1972"],
 ["Who started it","President John F. Kennedy set the goal; NASA and its contractors built it"],"tired",
 [["JFK Library","Address at Rice University on the Nation's Space Effort, 1962","https://www.jfklibrary.org/learn/about-jfk/historic-speeches/address-at-rice-university-on-the-nations-space-effort","The 'We choose to go to the Moon' speech, full text and film.","Primary source"],W("Apollo_program")],
 ["Apollo: The Race to the Moon, Charles Murray and Catherine Bly Cox","Failure Is Not an Option, Gene Kranz"]);
P("pixar","Pixar","founded 1986","org",ORG,"Emeryville, California · animation studio","film","sun",
 "Built a culture where anyone can say 'this isn't working yet', and made the first computer-animated film.",
 "Pixar began as the computer graphics group at Lucasfilm, led by Ed Catmull and Alvy Ray Smith. In 1986 Steve Jobs bought it and it became its own company. For years it struggled, selling hardware and making short films with animator John Lasseter. In 1995 it released Toy Story, the first fully computer-animated feature film. Its secret, Catmull wrote, is a culture of candour: the Braintrust, a group of directors who give each other frank notes on early, ugly versions, with the director free to decide.",
 ["Spun out of Lucasfilm in 1986","Toy Story, 1995: the first fully computer-animated feature","The Braintrust: candid feedback, no power to command"],
 ["Who started it","Ed Catmull and Alvy Ray Smith, with Steve Jobs and John Lasseter"],"expt",
 [["Harvard Business Review","How Pixar Fosters Collective Creativity, Ed Catmull (2008)","https://hbr.org/2008/09/how-pixar-fosters-collective-creativity","Pixar's co-founder on peer review, candour and learning from failure.","Long read"],W("Pixar")],
 ["Creativity, Inc., Ed Catmull with Amy Wallace"]);
P("patagonia","Patagonia","founded 1973","org",ORG,"Ventura, California · outdoor clothing","mountain","sky",
 "A climber who never wanted to be a businessman gave away his company to the Earth.",
 "Yvon Chouinard was a climber who taught himself blacksmithing to make reusable pitons, then stopped selling them when he saw they were scarring rock. His clothing company, Patagonia, became known for repairing gear instead of replacing it, giving a share of sales to environmental groups, and once telling customers in an advert not to buy its jacket. In 2022 Chouinard and his family gave the company away: a trust now holds the voting stock to protect its values, and profits not reinvested go to fight the environmental crisis.",
 ["Founded by climber Yvon Chouinard","Gave a share of sales to environmental groups for decades","In 2022 the family gave the company away"],
 ["Who started it","Yvon Chouinard"],"subtract",
 [["Patagonia","Earth is now our only shareholder, Yvon Chouinard","https://www.patagonia.ca/ownership","His letter explaining why he gave the company away.","Primary source"],W("Patagonia,_Inc.")],
 ["Let My People Go Surfing, Yvon Chouinard"]);
P("polio-india","Polio-free India","1995–2014","org","Seva","Every village and railway platform · public health campaign","drop","blush",
 "Millions of workers went door to door with two drops, until the last case in 2011.",
 "In the early 1990s India had a large share of the world's polio cases, and many experts doubted it could ever be stopped in such a crowded country. Under the Pulse Polio campaigns that began in 1995, health workers and volunteers gave oral drops to every child under five, going house to house, onto trains and buses, and into migrant settlements, again and again. The last case was recorded in January 2011 in Howrah, West Bengal. In March 2014 WHO certified the South-East Asia region, including India, as polio-free.",
 ["Pulse Polio campaigns from 1995","Last case: Howrah, West Bengal, January 2011","Certified polio-free by WHO in March 2014"],
 ["Who made it happen","Government health workers, Rotary, WHO, UNICEF and millions of volunteers"],"slow",
 [["CDC MMWR","Polio-free certification and lessons learned, South-East Asia Region, 2014","https://cdc.gov/mmwr/preview/mmwrhtml/mm6342a2.htm","The scientific report on how it was done.","Journal"],["WHO South-East Asia","Keeping the polio virus at bay","https://www.who.int/southeastasia/activities/maintaining-polio-free-status/keeping-the-polio-virus-at-bay","How the region stays polio-free.","Institution"],W("Polio_in_India")],
 null);
P("grameen","Grameen Bank","founded 1983","org","Seva","Jobra to all of Bangladesh · banking for the poor","house","mint",
 "An economics professor lent $27 to 42 villagers, and found the poor repay.",
 "After the 1974 famine in Bangladesh, economics professor Muhammad Yunus took his students into the nearby village of Jobra and found people, many of them women, trapped by moneylenders over tiny sums. In 1976 he lent 42 villagers a total of about $27 from his own pocket. They repaid. He went on lending without collateral, mostly to women, and in 1983 Grameen, 'village', Bank became a formal bank owned largely by its borrowers. In 2006 Yunus and Grameen Bank shared the Nobel Peace Prize.",
 ["First loans in Jobra, 1976","Became a bank owned largely by its borrowers in 1983","Nobel Peace Prize with Muhammad Yunus, 2006"],
 ["Who started it","Muhammad Yunus"],"cocoon",
 [NOB("peace/2006/yunus/lecture/","Nobel lecture, Muhammad Yunus, 2006","His own account of the first loans in Jobra."),W("Grameen_Bank")],
 ["Banker to the Poor, Muhammad Yunus"]);
P("sulabh","Sulabh International","founded 1970","org","Seva","Patna to all of India · sanitation and dignity","pump","sky",
 "A young sociologist lived among manual scavengers, then invented a toilet to free them.",
 "In 1968 Bindeshwar Pathak joined the Gandhi centenary committee in Bihar and was asked to work for the dignity of manual scavengers, people forced to clean dry latrines by hand. He lived with their families and saw the humiliation up close. In 1970 he founded Sulabh, promoting a cheap two-pit, pour-flush toilet that needs no scavenger, and pay-and-use public toilets across India. He worked for decades to train and rehabilitate former scavengers. He received the Stockholm Water Prize in 2009.",
 ["Founded in 1970 by Bindeshwar Pathak","Two-pit pour-flush toilet that needs no manual cleaning","Stockholm Water Prize, 2009"],
 ["Who started it","Bindeshwar Pathak, inspired by Gandhi's call to end scavenging"],"mine",
 [["Sulabh International","India's Sulabh man is no more","https://www.sulabhinternational.org/?p=21371","Sulabh's own tribute to its founder, with his life story.","Institution"],W("Sulabh_International"),W("Bindeshwar_Pathak")],
 null);
P("barefoot","Barefoot College","founded 1972","org","Seva","Tilonia, Rajasthan · grandmothers become solar engineers","sun","sun",
 "Trusts the knowledge of the poor: village women who never went to school become solar engineers.",
 "In 1972 Bunker Roy, who had grown up in privilege and studied at an elite school, went to work in the village of Tilonia in Rajasthan. Barefoot College grew there, built by villagers, on the idea that rural people's own skills are knowledge. It trains people without formal schooling, most famously middle-aged village women, many of them grandmothers, from villages around the world, who learn to build and repair solar lighting through gestures and colours, then return to electrify their own villages.",
 ["Founded in Tilonia, Rajasthan, in 1972","Trains rural women without formal schooling as solar engineers","Campus built by the villagers themselves"],
 ["Who started it","Bunker Roy"],"cultivate",
 [["Sierra magazine","India's Barefoot College","https://sierraclub.org/sierra/2012-5-september-october/feature/indias-barefoot-college","A long feature on the grandmother solar engineers.","Long read"],W("Barefoot_College")],

P("lijjat","Lijjat Papad","founded 1959","org",ORG,"Girgaum, Mumbai · a cooperative of women","papad","coral",
 "Seven women borrowed 80 rupees on a terrace and built a business owned by tens of thousands of 'sisters'.",
 "On 15 March 1959 seven Gujarati women on a rooftop in Girgaum, Mumbai, wanted to earn a living without leaving home. They borrowed 80 rupees from Chhaganlal Karamsi Parekh, a social worker, and started rolling papads. They insisted on making it pay its own way, and refused charity. It grew into Shri Mahila Griha Udyog Lijjat Papad, a cooperative where every member is an owner, called a 'sister', with tens of thousands of members across India.",
 ["Started by seven women on 15 March 1959 with an 80-rupee loan","Every member is a co-owner","Grew to tens of thousands of members"],
 ["Who started it","Jaswantiben Jamnadas Popat and six other women, guided by Chhaganlal Karamsi Parekh"],"cultivate",
 [W("Shri_Mahila_Griha_Udyog_Lijjat_Papad")],
 null);
P("dabbawalas","Mumbai's dabbawalas","since 1890","org",ORG,"Mumbai · lunch delivery by hand","tiffin","sun",
 "Thousands of men, many with little schooling, deliver hundreds of thousands of lunches a day, almost never wrong.",
 "Mumbai's dabbawala service traces back to 1890, when Mahadeo Havaji Bachche began delivering home-cooked lunches to office workers. Today thousands of dabbawalas collect tiffin boxes from homes, carry them by bicycle, handcart and local train, and deliver them to offices by lunchtime, then bring them back. A simple code of colours and symbols painted on each box tells everyone where it goes. Their reliability, built on teamwork and pride rather than technology, has been studied by business schools.",
 ["Service started around 1890","Boxes travel by bicycle, cart and local train","A painted code of colours and symbols routes every box"],
 ["Who started it","Mahadeo Havaji Bachche"],"serve",
 [W("Dabbawala")],
 ["The Dabbawala System: On-Time Delivery, Every Time, Stefan Thomke (Harvard Business School case)"]);

const KS=["Sacred Texts","Kalpa Sutra (Lives of the Jinas), tr. Hermann Jacobi, 1884","https://sacred-texts.com/jai/sbe22/sbe2201.htm","The classic scripture of the lives of Mahavira, Parshva, Arishtanemi and Rishabha.","Primary source"];

/* Tirthankaras */
P("tirthankaras","The 24 Tirthankaras","this time cycle","past","Spiritual","Jain tradition · the ford-makers","svastika","sun",
 "Twenty-four who crossed the river of birth and death, and built a ford so others could cross.",
 "A Tirthankara is a 'ford-maker': one who conquers attachment and aversion, attains omniscience, kevala jnana, and then shows the path so others can cross the ocean of worldly existence. In this half of the time cycle there have been twenty-four: Rishabhanatha (Adinatha), Ajitanatha, Sambhavanatha, Abhinandananatha, Sumatinatha, Padmaprabha, Suparshvanatha, Chandraprabha, Suvidhinatha (Pushpadanta), Shitalanatha, Shreyansanatha, Vasupujya, Vimalanatha, Anantanatha, Dharmanatha, Shantinatha, Kunthunatha, Aranatha, Mallinatha, Munisuvrata, Naminatha, Neminatha, Parshvanatha and Mahavira. Each is honoured by an emblem, such as Rishabha's bull, Neminatha's conch and Parshvanatha's serpent.",
 ["'Tirthankara' means maker of the ford","Twenty-four in this half of the time cycle, from Rishabhanatha to Mahavira","Each one first conquered within, then taught"],
 ["What they inspire","Jindasha: contemplating Their state until you want it for yourself"],"mahavira",
 [KS,W("Tirthankara"),W("List_of_tirthankaras")],
 ["Kalpa Sutra","The Jaina Path of Purification, Padmanabh S. Jaini"]);
P("rishabhdev","Bhagwan Rishabhdev (Adinath)","1st Tirthankara","past","Spiritual","Ayodhya · the first Tirthankara","bull","sun",
 "The first king to teach people farming and writing, then the first to give it all up.",
 "Jain tradition remembers Rishabhdev as the first king of this age, born in Ayodhya, who taught people farming, crafts, writing and arithmetic, and the institutions of family and society. His sons included Bharata, the first chakravartin, and Bahubali. Then He renounced His kingdom. Tradition says no one yet knew how to offer alms to a monk, so He went without food for about a year, until Prince Shreyans offered Him sugarcane juice, remembered on Akshaya Tritiya. He attained liberation on Mount Ashtapada, identified with Kailash.",
 ["First of the 24 Tirthankaras; also called Adinath, 'first lord'","Taught farming, crafts, writing and arithmetic","Broke a year-long fast with sugarcane juice: the origin of varshitap and Akshaya Tritiya"],
 ["His sons","Bharata, the first chakravartin, and Bahubali, who stood in meditation until vines grew over Him"],"subtract",
 [["Britannica","Rishabhanatha","https://www.britannica.com/topic/Rishabhanatha","A careful account of the first Tirthankara in Jain tradition.","Reference"],KS,W("Rishabhanatha")],
 ["Kalpa Sutra","Adi Purana, Acharya Jinasena"]);
P("neminath","Bhagwan Neminath","22nd Tirthankara","past","Spiritual","Dwarka to Girnar · the 22nd Tirthankara","conch","sky",
 "On His wedding day He heard the animals penned for the feast, turned His chariot around, and walked to Girnar.",
 "Jain tradition tells that Neminath, also called Arishtanemi, a cousin of Krishna, rode in procession to marry Princess Rajimati. On the way He heard the cries of animals penned up to be slaughtered for the wedding feast. Moved by compassion, He had them released, turned His chariot around and renounced the world, attaining omniscience on Mount Girnar. Rajimati, too, renounced and became a nun. The scene is painted in centuries-old Kalpa Sutra manuscripts.",
 ["The 22nd Tirthankara, emblem the conch","Renounced on His wedding day out of compassion for animals","Attained omniscience and liberation on Mount Girnar"],
 ["Who followed Him","Rajimati, His bride, who also renounced"],"mine",
 [["Victoria and Albert Museum","Kalpasutra folio: Neminatha's birth and renunciation","https://collections.vam.ac.uk/item/O143132","A Gujarati painting of around 1500 showing the wedding procession and the penned animals.","Institution"],KS,W("Neminatha")],
 ["Kalpa Sutra"]);
P("parshvanath","Bhagwan Parshvanath","23rd Tirthankara","past","Spiritual","Varanasi · the 23rd Tirthankara","serpent","mint",
 "Saved a pair of serpents from a burning log; in His meditation, a serpent king sheltered Him from the storm.",
 "Parshvanath lived some 250 years before Mahavira and is the first Tirthankara for whom historians find evidence. Tradition says that as a prince of Varanasi He saw an ascetic burning a log with serpents inside, and had them rescued. Reborn as the serpent lord Dharanendra, one later shaded Him with its hood when a rival, Kamath, unleashed a storm on Him in meditation. Through it all He felt neither anger at the attacker nor attachment to the protector. His followers kept a fourfold restraint: not to kill, steal, lie or own property.",
 ["The 23rd Tirthankara, emblem the serpent","About 250 years before Mahavira","Taught the fourfold restraint; Mahavira later added celibacy","Attained liberation at Sammed Shikhar"],
 ["His equanimity","Even toward Kamath, who attacked Him, and Dharanendra, who protected Him"],"equan",
 [["Britannica","Parshvanatha","https://www.britannica.com/biography/Parshvanatha","A careful account of what history and legend say.","Reference"],KS,W("Parshvanatha")],
 ["Kalpa Sutra"]);

P("dada-bhagwan","Dada Bhagwan","1908–1988","past","Spiritual","Tarsali, Gujarat · Gnani Purush of Akram Vignan","bench","lilac",
 "A building contractor sat on a bench at Surat station, and stood up a knower of the Self.",
 "Ambalal Muljibhai Patel was a building contractor whose firm built and maintained dry docks in Bombay harbour. One evening in June 1958, sitting on a bench on platform 3 of Surat railway station, he had an experience of the Self that he said lasted about 48 minutes. He taught that the one people saw was A. M. Patel; 'Dada Bhagwan' was the Lord manifest within. From 1968 he offered the Gnan Vidhi, a ceremony of Self-realisation, through what he called Akram Vignan, the stepless path, and pointed his followers to the living Tirthankara Simandhar Swami.",
 ["A contractor by profession","Experience of the Self at Surat station, June 1958","First public Gnan Vidhi in 1968","Founded Akram Vignan, the stepless path"],
 ["Whom he pointed to","Lord Simandhar Swami, the living Tirthankara"],"notbody",
 [["Dada Bhagwan Foundation","Dada Bhagwan","https://www.dadabhagwan.org/","His teachings and free books, from the foundation that carries them.","Institution"],W("Dada_Bhagwan")],
 ["Who Am I?, Dada Bhagwan","Avoid Clashes, Dada Bhagwan","Aptavani, Dada Bhagwan"]);

/* History & kingdoms */
P("chanakya","Chanakya","c. 4th century BCE","past","History & kingdoms","Taxila and Pataliputra · teacher and kingmaker","scroll","lilac",
 "A teacher humiliated at a king's court found a boy, trained him, and together they built an empire.",
 "Chanakya, also known as Kautilya, was a teacher, tradition says at Taxila. A well-known story tells that he was insulted at the court of the Nanda king and vowed to bring the dynasty down. He found a young Chandragupta, trained him, and guided him to overthrow the Nandas and found the Maurya empire, one of the largest India has known. The Arthashastra, a vast treatise on statecraft, economics and justice, is attributed to him. In Jain tradition, Chandragupta later renounced his throne and went south with the monk Bhadrabahu to Shravanabelagola.",
 ["Teacher and adviser to Chandragupta Maurya","Helped found the Maurya empire, about 321 BCE","The Arthashastra is attributed to him"],
 ["His student","Chandragupta Maurya"],"mentor",
 [["Britannica","Chanakya","https://www.britannica.com/biography/Chanakya","A careful account separating history from legend.","Reference"],["Columbia University (Frances Pritchett)","Kautilya's Arthashastra, tr. R. Shamasastry (1915)","https://franpritchett.com/00litlinks/kautilya/index.html","All fifteen books, in the first English translation.","Primary source"],W("Chanakya")],
 ["King, Governance, and Law in Ancient India: Kautilya's Arthashastra, Patrick Olivelle","The Kautiliya Arthashastra, R. P. Kangle"]);
P("ashoka","Emperor Ashoka","c. 304–232 BCE","past","History & kingdoms","Pataliputra · Maurya emperor","pillar","sun",
 "Won a terrible war, saw the dead, and spent the rest of his reign carving his remorse and his values in stone.",
 "Ashoka, grandson of Chandragupta Maurya, ruled most of the subcontinent. Around 261 BCE he conquered Kalinga, in today's Odisha, at the cost of enormous suffering. Afterwards he had his remorse inscribed on rock for all to read. He turned to the Buddha's teaching and to dhamma: kindness to all beings, respect for every faith, care for parents and servants. He had wells dug and trees planted along roads, and set up medical care for people and animals. His lion capital is India's national emblem, and his wheel is on its flag.",
 ["Conquered Kalinga around 261 BCE, then turned from war","Inscribed edicts on rocks and pillars across the empire","Promoted respect for all faiths and care for animals","His lion capital is India's national emblem"],
 ["Who turned him","The suffering he saw at Kalinga, and the Buddha's teaching"],"paradigm",
 [["Access to Insight","The Edicts of King Asoka, tr. Ven. S. Dhammika","https://accesstoinsight.org/lib/authors/dhammika/wheel386.html","His own words, carved in stone, in a full English rendering.","Primary source"],W("Ashoka")],
 ["Ashoka: The Search for India's Lost Emperor, Charles Allen","Ashoka in Ancient India, Nayanjot Lahiri"]);
P("rajaraja","Raja Raja Chola I","r. 985–1014","past","History & kingdoms","Thanjavur · Chola emperor and temple builder","temple","coral",
 "Built a granite temple so tall and precise it still stands a thousand years later, and wrote down the names of those who served in it.",
 "Raja Raja Chola I made the Chola kingdom a great power of South India and the seas, with a navy that reached Sri Lanka and the Maldives. He had his lands carefully surveyed and governed. His lasting gift is the Brihadisvara temple at Thanjavur, completed around 1010, its tower among the tallest of its time, built of granite. Its inscriptions record the names of the dancers, musicians and craftspeople who served the temple, and how they were paid. It is a UNESCO World Heritage Site and is still a living place of worship.",
 ["Ruled from 985 to 1014","Brihadisvara temple completed around 1010","Temple inscriptions record names of the people who served it"],
 ["What he built for","Shiva, and the people of his kingdom, whose names he had carved in stone"],"higher",
 [["UNESCO World Heritage Centre","Great Living Chola Temples","https://whc.unesco.org/en/list/250","Why the Thanjavur temple is a World Heritage Site.","Institution"],W("Rajaraja_I"),W("Brihadisvara_Temple")],
 ["Ponniyin Selvan, Kalki Krishnamurthy (novel)","The Cholas, K. A. Nilakanta Sastri"]);
P("akbar","Emperor Akbar","1542–1605","past","History & kingdoms","Agra and Fatehpur Sikri · Mughal emperor","crown","blush",
 "A king who could not read gathered teachers of every faith to argue in his hall, and listened.",
 "Akbar became emperor at thirteen, guided at first by his regent Bairam Khan. Though he never learned to read, he had books read to him daily. He abolished the tax on Hindu pilgrims and the jizya, and at Fatehpur Sikri built the Ibadat Khana, a house of worship, where Muslim, Hindu, Jain, Zoroastrian and Christian scholars debated before him. The Jain monk Hiravijaya Suri visited his court, and Akbar issued orders restricting animal slaughter on Jain holy days. His court was also home to the singer Tansen, whose story with his teacher Swami Haridas appears in the satsang.",
 ["Emperor at thirteen, in 1556","Abolished the jizya and the pilgrim tax","Built the Ibadat Khana at Fatehpur Sikri for debate among faiths","Hosted the Jain monk Hiravijaya Suri"],
 ["Who shaped him","His regent Bairam Khan, and teachers of many faiths, including the Jain monk Hiravijaya Suri"],"god",
 [["Britannica","Akbar","https://www.britannica.com/biography/Akbar","A careful, edited biography.","Reference"],W("Akbar"),W("Hiravijaya")],
 ["Akbar: The Great Mughal, Ira Mukhoty","The Mughal Throne, Abraham Eraly"]);
P("shivaji","Chhatrapati Shivaji Maharaj","1630–1680","past","History & kingdoms","Shivneri to Raigad · founder of the Maratha kingdom","fort","sky",
 "Raised on his mother's stories of dharma, he took his first fort at sixteen and built a kingdom from the hills.",
 "Shivaji was born at Shivneri fort and raised largely by his mother, Jijabai, who filled his childhood with stories from the Ramayana and Mahabharata and a sense of duty to his people. As a teenager he captured the fort of Torna and went on to build a kingdom in the hills of the Sahyadris, with a chain of forts and one of India's early navies. Held at Agra by Aurangzeb in 1666, he escaped. He was crowned Chhatrapati at Raigad in 1674. He was known for respecting places of worship of every faith.",
 ["Took Torna fort as a teenager","Escaped from Aurangzeb's custody at Agra in 1666","Crowned at Raigad in 1674","Built forts and a navy along the Konkan coast"],
 ["Who shaped him","His mother, Jijabai"],"cultivate",
 [["Britannica","Shivaji","https://www.britannica.com/biography/Shivaji","A careful, edited biography.","Reference"],W("Shivaji")],
 ["Shivaji and His Times, Jadunath Sarkar","Shivaji: India's Great Warrior King, Vaibhav Purandare"]);

/* order: pinned first, then by field */
(function(){
  const pin=["rajchandra","gurudevshri"];
  const order=f=>FIELDS.indexOf(f);
  const rest=people.filter(p=>!pin.includes(p.slug));
  rest.sort((a,b)=>order(a.field)-order(b.field));
  const head=pin.map(s=>people.find(p=>p.slug===s));
  people.length=0; people.push(...head,...rest);
})();

const THINK={

 nakamura:{ideas:["Treat the cause, not only the symptom: water before medicine.","Use methods local people can maintain without you.","Stay, especially when others leave."]},

  </section>
  ${prevNext(p)}`;
}

/* ---------- the one-year path ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const REFLECT=[12,25,38,51];
function yearPlan(){
  const pin=["rajchandra","gurudevshri"];
  const groups=FIELDS.slice(1).map(f=>people.filter(p=>p.field===f&&!pin.includes(p.slug)));
  const mixed=[];let more=true;
  for(let r=0;more;r++){more=false;for(const g of groups){if(g[r]){mixed.push(g[r]);more=true}}}
  const seq=[...pin.map(s=>people.find(p=>p.slug===s)),...mixed];
  const weeks=[];let i=0;
  for(let w=0;w<52;w++){
    if(REFLECT.includes(w)){weeks.push({w:w+1,reflect:true});continue}
    const left=52-w-REFLECT.filter(x=>x>=w).length, per=Math.ceil((seq.length-i)/Math.max(left,1));
    weeks.push({w:w+1,items:seq.slice(i,i+per)}); i+=per;
  }
  return weeks;
}
function readBar(p){
  const done=store.get('insp-read',[]).includes(p.slug);
  return `<div class="readbar"><button type="button" class="btn ${done?'':'ghost'}" data-read="${p.slug}" aria-pressed="${done}">${done?'✓ Read':'Mark as read'}</button><a class="btn ghost" href="#year">The one-year path</a></div>`;
}
function yearPage(){
  const weeks=yearPlan(), read=store.get('insp-read',[]), start=store.get('insp-start',null);
  const total=people.length, n=people.filter(p=>read.includes(p.slug)).length;
  const cur=start?Math.min(52,Math.max(1,Math.floor((Date.now()-start)/(7*864e5))+1)):0;
  app.innerHTML=`
  <div class="ptitle"><div class="meta">two stories a week · fifty-two weeks</div><h1>A year of inspiration</h1>
  <div class="where">${start?`You're in week ${cur} of 52 · ${n} of ${total} read`:`${total} stories, mixed across every field. Every thirteenth week, go back to the satsang.`}</div></div>
  <div class="yprog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="Stories read"><i style="width:${(n/total*100).toFixed(1)}%"></i></div>
  <div class="btns" style="justify-content:center">${start?`<button type="button" class="btn ghost" id="restart">Restart at week 1</button>`:`<button type="button" class="btn" id="startyear">Start my year today</button>`}<button type="button" class="btn ghost" id="remind">Nightly reminder (calendar)</button><a class="btn ghost" href="${SAT}" target="_blank" rel="noopener">Watch the satsang ↗</a></div>
  <div class="weeks">${weeks.map(k=>`<section class="wk${k.w===cur?' now':''}${k.reflect?' rf':''}" ${k.w===cur?'id="now"':''}>
    <div class="wn">Week ${k.w}${k.w===cur?' · this week':''}</div>
    ${k.reflect?`<h3>Return to the satsang</h3><p>Watch it again. Which line lands differently now?</p><blockquote>“Inspiration is His, but you have let yourself... getting inspired.”<cite>29:09</cite></blockquote><a class="btn ghost" href="${SAT}" target="_blank" rel="noopener">Watch ↗</a>`
    :k.items.map(p=>`<label class="yi"><input type="checkbox" data-slug="${p.slug}" ${read.includes(p.slug)?'checked':''}><span><a href="#${p.slug}">${esc(p.name)}</a><small><span style="color:${FIELD_DOT[p.field]}">●</span> ${esc(p.field)}</small></span></label>`).join('')}
  </section>`).join('')}</div>`;
  const b=document.getElementById('startyear')||document.getElementById('restart');
  if(b) b.addEventListener('click',()=>{store.set('insp-start',Date.now());yearPage()});
  app.querySelectorAll('.yi input').forEach(c=>c.addEventListener('change',()=>{
    const r=new Set(store.get('insp-read',[]));c.checked?r.add(c.dataset.slug):r.delete(c.dataset.slug);store.set('insp-read',[...r]);
    const m=people.filter(p=>r.has(p.slug)).length,bar=app.querySelector('.yprog i');if(bar)bar.style.width=(m/total*100).toFixed(1)+'%';
  }));
  const rm=document.getElementById('remind'); if(rm) rm.addEventListener('click',()=>{
    const d=new Date(), p=n=>String(n).padStart(2,'0'), ds=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
    const url=location.href.split('#')[0]+'#year';
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//World of Inspiration//EN','BEGIN:VEVENT','UID:insp-nightly-'+Date.now()+'@inspiration','DTSTAMP:'+ds+'T000000Z','DTSTART:'+ds+'T210000','DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:Tonight\'s inspiration','DESCRIPTION:Read tonight\'s story: '+url,'URL:'+url,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Tonight\'s inspiration','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download='inspiration-nightly.ics'; document.body.appendChild(a); a.click(); a.remove();
  });
  const now=document.getElementById('now'); if(now&&n>0) setTimeout(()=>now.scrollIntoView({block:'center'}),50);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-read]'); if(!b) return;
  const r=new Set(store.get('insp-read',[])),s=b.dataset.read;
  r.has(s)?r.delete(s):r.add(s); store.set('insp-read',[...r]);
  const on=r.has(s); b.textContent=on?'✓ Read':'Mark as read'; b.classList.toggle('ghost',!on); b.setAttribute('aria-pressed',on);
});

function route(){
  const slug=location.hash.replace('#','');
  const p=people.find(x=>x.slug===slug);
  if(slug==="year") yearPage(); else if(!p) home(); else if(p.slug==="kalam") kalam(p); else if(p.slug==="rajchandra") rajchandra(p); else person(p);
  if(p) app.insertAdjacentHTML('beforeend',readBar(p));
  document.title=p?`${p.name} · World of Inspiration`:slug==="year"?"A year of inspiration · World of Inspiration":"World of Inspiration";
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
