<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bedtime stories for grown-ups: inspiring lives, seva and organizations, with a one-year reading path.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspiration">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>World of Inspiration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: bright sunrise sketchbook — huge display headline over a rising sun, a ticker of lives, tonight's story, shelves by era; person pages open with a coloured band, then mentor, satsang line, story, reads */
:root{
  --bg:#ffffff; --bg-2:#f4f6fb; --ink:#14161f; --ink-2:#5a6178; --line:#e3e6ee;
  --tomato:#ff5a36; --sun:#ffc533; --mint:#1fbf94; --sky:#3f86ff; --grape:#8a63ff;
  --display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
}
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;margin:0}
.hand{font-family:var(--hand)}
.eyebrow{font-family:var(--hand);font-size:1.15rem;color:var(--tomato)}

nav.top{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;padding-block:18px}
nav.top a{text-decoration:none;font-family:var(--display);font-weight:600;font-size:1rem}
nav.top .brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px}
nav.top .brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 35%,transparent)}

/* hero */
.hero{position:relative;text-align:center;padding-block:28px 12px}
.sunrise{width:min(520px,92%);height:auto;display:block;margin:0 auto -64px;max-width:100%}
.rays{transform-origin:260px 260px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{position:relative;font-size:clamp(3.6rem,13vw,9.5rem)}
.hero h1 span{color:var(--tomato)}
.hero h1 small{display:block;font-size:.34em;line-height:1;margin-bottom:.08em;color:var(--ink-2);letter-spacing:-.01em}
.hero .lede{max-width:30em;margin:14px auto 0;font-size:1.25rem;color:var(--ink-2)}
.pillars{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.pill{font-family:var(--display);font-weight:600;font-size:.95rem;padding:7px 14px;border-radius:999px;background:var(--bg-2);border:1.5px solid var(--line)}
.pill b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* ticker */
.ticker{margin-top:36px;border-block:1.5px solid var(--line);overflow:hidden;padding-block:12px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .track{display:flex;gap:38px;width:max-content;animation:tick 90s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{text-decoration:none;white-space:nowrap;font-size:1.05rem}
.ticker a b{font-family:var(--display);font-weight:800;margin-right:8px}
.ticker a i{color:var(--ink-2)}
@keyframes tick{to{transform:translateX(-50%)}}

/* why */
.why{display:grid;grid-template-columns:1fr 1.2fr;gap:36px;align-items:center;padding-block:56px 8px}
.why h2{font-size:clamp(2rem,5vw,3.2rem)}
.why blockquote{margin:0;font-size:1.45rem;line-height:1.4;font-style:italic;border-left:5px solid var(--sun);padding-left:20px}
.why blockquote cite{display:block;margin-top:10px;font-style:normal;font-family:var(--hand);font-size:1.05rem;color:var(--ink-2)}
.why p{color:var(--ink-2);margin:12px 0 0}

/* tonight */
.tonight{margin-top:52px;display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center;padding:24px;border-radius:28px;background:var(--bg-2);border:1.5px solid var(--line)}
.tonight .art{border-radius:20px;aspect-ratio:1;max-width:100%}
.tonight h2{font-size:clamp(2rem,5vw,3rem);margin:4px 0 8px}
.tonight p{margin:0;color:var(--ink-2);font-size:1.15rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{font-family:var(--display);font-weight:600;font-size:1rem;text-decoration:none;cursor:pointer;border:0;border-radius:999px;padding:11px 20px;background:var(--ink);color:var(--bg);transition:transform .15s}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:hover{transform:translateY(-2px)}

/* filters */
.filterbar{display:flex;flex-direction:column;gap:12px;align-items:center;margin:64px 0 8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.filters button{font:inherit;font-family:var(--display);font-weight:600;font-size:.95rem;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 15px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.era{padding-top:36px}
.erahead{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:20px}
.erahead h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.erahead span{color:var(--ink-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}

/* emblem art */
.art{display:grid;place-items:center;border:2.5px solid #14161f}
.art svg{width:52%;height:auto}

.tile{display:flex;flex-direction:column;text-decoration:none;border-radius:22px;background:var(--bg);border:1.5px solid var(--line);overflow:hidden;transition:transform .2s,box-shadow .2s;min-width:0}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 40px -18px rgba(20,22,31,.35)}
.tile .art{aspect-ratio:16/10;border:0;border-bottom:2.5px solid #14161f;max-width:100%;position:relative}
.tile .art .yrs{position:absolute;top:10px;right:10px;font-family:var(--hand);font-size:.9rem;background:#fff;color:#14161f;border:2px solid #14161f;border-radius:999px;padding:0 10px}
.tile .art .star{position:absolute;top:10px;left:10px;font-family:var(--hand);font-weight:700;font-size:.9rem;background:#14161f;color:#fff;border-radius:999px;padding:1px 10px}
.tile .tx{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.tile .fld{font-family:var(--display);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.tile h3{font-size:1.4rem;letter-spacing:-.01em}
.tile .line{font-size:1rem;line-height:1.45;color:var(--ink-2)}

/* person */
.band{border-radius:30px;border:2.5px solid #14161f;padding:32px;display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;color:#14161f;margin-top:8px}
.band .emb{width:150px;aspect-ratio:1;background:#fff;border:2.5px solid #14161f;border-radius:26px;display:grid;place-items:center;max-width:100%;transform:rotate(-4deg)}
.band .emb svg{width:70%}
.band .meta{font-family:var(--hand);font-size:1.1rem}
.band h1{font-size:clamp(2.6rem,7vw,5rem);margin:4px 0 6px}
.band .where{font-family:var(--display);font-weight:600}
.scenebox{border-radius:30px;background:#fbf7ef;border:2.5px solid #14161f;overflow:hidden;margin-top:8px}
.scene{display:block;width:100%;height:auto;max-width:100%}
.ptitle{text-align:center;margin-top:28px}
.ptitle .meta{font-family:var(--hand);font-size:1.1rem;color:var(--tomato)}
.ptitle h1{font-size:clamp(2.6rem,7vw,5rem);margin:6px 0}
.ptitle .where{font-family:var(--display);font-weight:600;color:var(--ink-2)}
.beyond{font-size:clamp(1.4rem,3vw,1.9rem);font-style:italic;line-height:1.35;max-width:28em;margin:30px auto 0;text-align:center}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.box{border-radius:22px;padding:22px 24px;border:1.5px solid var(--line);background:var(--bg-2);min-width:0}
.box .k{font-family:var(--display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.box .v{font-size:1.15rem;margin-top:6px}
.box.sat{background:color-mix(in srgb,var(--sun) 18%,var(--bg));border-color:color-mix(in srgb,var(--sun) 50%,var(--line))}
.box.sat q{font-style:italic;font-size:1.2rem;quotes:"\201C" "\201D"}
.box.sat .t{display:block;margin-top:8px;font-family:var(--hand);color:var(--ink-2);font-size:1rem}

section.block{padding-top:52px}
.block h2{font-size:clamp(1.7rem,4vw,2.4rem);margin:4px 0 14px}
.prose{max-width:38em}
.prose p{margin:0 0 14px}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.facts li{display:flex;gap:12px;align-items:baseline}
.facts li:before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--tomato);transform:translateY(-2px) rotate(45deg)}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start}

.tl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.tl li{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:12px 0;border-top:1.5px solid var(--line)}
.tl .yr{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--tomato);font-variant-numeric:tabular-nums}

.reads{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.read{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:18px;border:1.5px solid var(--line);text-decoration:none;background:var(--bg);transition:border-color .15s,transform .15s}
.read:hover{border-color:var(--ink);transform:translateY(-3px)}
.read .src{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.read .ty{color:var(--tomato)}
.read .t{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.25}
.read .w{font-size:.98rem;color:var(--ink-2);line-height:1.45}
.ideas{margin:0;padding:0;list-style:none;counter-reset:i;display:grid;gap:14px}
.ideas li{counter-increment:i;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;font-size:1.12rem;line-height:1.45}
.ideas li:before{content:counter(i);display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--sun);color:#14161f;font-family:var(--display);font-weight:800}
.words{margin:0;padding:26px 26px 22px;border-radius:22px;background:#14161f;color:#fff;position:relative}
.words blockquote{margin:0;font-family:var(--body);font-style:italic;font-size:1.45rem;line-height:1.35}
.words figcaption{margin-top:12px;font-family:var(--hand);color:#ffd166;font-size:1.02rem}
.qc{font-family:var(--hand);color:var(--ink-2);font-size:1.02rem;margin:-6px 0 16px}
.read .ty{white-space:nowrap}
.books{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.bk{display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px 16px 10px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:1rem;background:var(--bg)}
.bk:hover{border-color:var(--ink)}
.bk:before{content:"";width:10px;height:28px;border-radius:2px;background:var(--grape);flex:none}

/* comic */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.panel{background:#fffef8;color:#2a2622;border:2.5px solid #2a2622;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel svg{width:100%;height:auto;max-width:100%}
.panel p{margin:0;font-size:.95rem;line-height:1.45}
.panel .n{font-family:var(--hand);font-weight:700;color:#c2482b}
.verse{font-family:var(--hand);font-size:1.5rem;line-height:1.45;margin:0 0 12px}

.pn{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:64px;padding-top:24px;border-top:1.5px solid var(--line)}
.pn a{text-decoration:none;font-family:var(--display);font-weight:600;min-width:0}
.pn a span{display:block;font-family:var(--hand);font-weight:400;color:var(--ink-2);font-size:.95rem}

footer{margin-top:72px;padding-block:32px 56px;border-top:1.5px solid var(--line);text-align:center;color:var(--ink-2)}
footer .hand{font-size:1.25rem;color:var(--ink)}
footer p{margin:6px 0}

@media (max-width:820px){
  .why,.split,.duo{grid-template-columns:1fr}
  .tonight{grid-template-columns:1fr;text-align:center}.tonight .art{width:180px;margin:0 auto}.btns{justify-content:center}
  .strip{grid-template-columns:repeat(2,1fr)}
  .band{grid-template-columns:1fr;text-align:center}.band .emb{margin:0 auto;width:120px}
  body{font-size:18px}
}
@media (max-width:440px){.strip{grid-template-columns:1fr}.band{padding:22px}}
.navr{display:flex;gap:18px;flex-wrap:wrap}
.readbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:40px 0 8px}
.yprog{height:12px;border-radius:999px;background:var(--bg-2);border:1.5px solid var(--line);max-width:520px;margin:22px auto 6px;overflow:hidden}
.yprog i{display:block;height:100%;background:var(--mint);transition:width .3s}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:34px}
.wk{border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff;min-width:0}
.wk.now{border:2.5px solid #14161f;box-shadow:5px 5px 0 var(--sun)}
.wk.rf{background:#fff7dc}
.wk .wn{font-family:var(--hand);color:var(--tomato);font-size:1.05rem;margin-bottom:6px}
.wk h3{margin:2px 0 4px;font-size:1.2rem}.wk p{margin:0 0 8px;color:var(--ink-2)}
.wk blockquote{margin:0 0 10px;font-style:italic}.wk blockquote cite{display:block;font-style:normal;font-size:.85rem;color:var(--ink-2)}
.yi{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.yi input{width:20px;height:20px;margin-top:3px;accent-color:var(--mint);flex:none}
.yi a{font-family:var(--display);font-weight:700;color:var(--ink);text-decoration:none}.yi a:hover{text-decoration:underline}
.yi small{display:block;color:var(--ink-2);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.rays,.ticker .track{animation:none}.tile,.read,.btn{transition:none}}
</style>
<style>
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (display-mode:standalone){nav.top{position:sticky;top:0;z-index:5;background:var(--bg)}}
</style>
</head>
<body>


<div class="wrap">
  <nav class="top"><a class="brand" href="#"><i aria-hidden="true"></i>World of Inspiration</a><span class="navr"><a href="#year">A year</a><a href="#" id="navall">All lives</a></span></nav>
  <main id="app"></main>
  <footer>
    <p class="hand">Two stories a week, for a year. Ask what they went beyond, and who it was for.</p>
    <p>Grounded in a satsang on Verse 135 of the Atmasiddhi Shastra. Stories are short retellings in our own words; follow the links for the full accounts.</p>
  </footer>
</div>

  links:[["Project Gutenberg","Father Damien: An Open Letter to the Reverend Dr. Hyde, by Robert Louis Stevenson (1890)","https://www.gutenberg.org/ebooks/281","Stevenson visited Molokai after Damien's death and wrote this furious, moving defence of him.","Primary source"],["National Parks Conservation Association","Exiled to Paradise","https://www.npca.org/articles/1062-exiled-to-paradise","Long-form history of the Kalaupapa settlement.","Long read"],W("Father_Damien")],
  books:["Holy Man: Father Damien of Molokai, Gavan Daws"]},
 {slug:"kolbe",name:"Maximilian Kolbe",years:"1894–1941",era:"past",field:"Spiritual",where:"Poland · priest",icon:"heart",color:"coral",
  beyond:"Volunteered to die in place of a stranger.",
  story:"In 1941 a guard at Auschwitz picked ten men to starve in reprisal for an escape. Franciszek Gajowniczek cried out for his wife and children. Kolbe, a Franciscan priest, stepped forward and asked to take his place. He led the others in prayer until the end. Gajowniczek survived the war and lived into his nineties.",
  facts:["Prisoner 16670 at Auschwitz","Gave his life on 14 August 1941","The man he saved, Franciszek Gajowniczek, survived the war"],
  satsang:["Even I want to try that acceptance. I want to try that forgiveness.","1:09:34"],
  links:[["Auschwitz Memorial","84th anniversary of the death of Father Kolbe","https://www.auschwitz.org/en/museum/news/84th-anniversary-of-the-death-of-father-maximilian-kolbe,1785.html","From the museum on the site, with the camp record.","Institution"],["Britannica","St. Maksymilian Maria Kolbe","https://britannica.com/biography/Saint-Maksymilian-Maria-Kolbe","A careful, edited biography.","Reference"],W("Maximilian_Kolbe")],},

 {slug:"salk",name:"Jonas Salk",years:"1914–1995",era:"past",field:"Science",where:"New York, USA · virologist",icon:"sun",color:"sky",
  beyond:"Asked who owned the polio vaccine, he said: the people.",
  story:"Polio paralysed tens of thousands of children a year. Salk's killed-virus vaccine was tested on over a million children and declared safe in 1955. When a TV host asked who held the patent, he asked back whether you could patent the sun. Historians note it may not have been patentable anyway, but the stance shaped how a generation saw science.",
  facts:["Vaccine declared safe and effective in April 1955","Tested it first on himself and his family","Founded the Salk Institute in 1960"],
  circle:["His mentor","Thomas Francis Jr., with whom he worked on the influenza vaccine"],
  satsang:["Whatever you do, do for the higher purpose.","38:54"],
  links:[["Salk Institute","History of Salk: Jonas Salk","https://www.salk.edu/about/jonas-salk/","The institute he founded, on his life and science.","Institution"],["Retro Report","Could You Patent the Sun?","https://www.bunkhistory.org/resources/could-you-patent-the-sun-retro-report","A documentary short on Salk and how drug patents changed after him.","Documentary"],W("Jonas_Salk")],
  books:["Patenting the Sun, Jane S. Smith"]},
 {slug:"curie",name:"Marie Curie",years:"1867–1934",era:"past",field:"Science",where:"Poland and France · physicist and chemist",icon:"vial",color:"mint",
  beyond:"Worked in a leaky shed and gave her method away.",
  story:"Born in Warsaw when women could not attend university there, she studied in secret, then in Paris. With Pierre she discovered polonium and radium while working in a shed with a leaking roof. They chose not to patent the process for isolating radium, so science and medicine could use it freely. In the First World War she drove mobile X-ray units to the front.",
  facts:["First woman to win a Nobel Prize","Only person to win Nobel Prizes in two sciences","Ran mobile X-ray units in the First World War"],
  circle:["Her partner in work","Pierre Curie, building on Henri Becquerel's discovery of radioactivity"],
  satsang:["See, for me, spirituality is science, and science means experiments.","42:33"],
  links:[["Nobel Prize","Radium and the New Concepts in Chemistry, her 1911 Nobel lecture","https://www.nobelprize.org/prizes/chemistry/1911/marie-curie/lecture/","Her own words on the discovery.","Primary source"],["Nobel Prize","Marie Curie, biographical","https://www.nobelprize.org/prizes/physics/1903/marie-curie/biographical/","The Nobel Foundation's account of her life.","Institution"],W("Marie_Curie")],
  books:["Madame Curie, Ève Curie"]},
 {slug:"borlaug",name:"Norman Borlaug",years:"1914–2009",era:"modern",field:"Science",where:"Iowa, USA to Mexico and South Asia · agronomist",icon:"wheat",color:"sun",
  beyond:"Spent twenty years in wheat fields so others would not go hungry.",
  story:"A farm boy from Iowa, he went to Mexico and bred thousands of wheat crosses by hand, growing two generations a year by moving between highlands and lowlands. His short, disease-resistant wheat reached India and Pakistan in the 1960s, when famine was widely predicted, and harvests rose sharply. He is often credited with helping save hundreds of millions from hunger.",
  facts:["Developed high-yield, disease-resistant dwarf wheat","Seeds reached India and Pakistan in the mid-1960s","Nobel Peace Prize, 1970"],
  circle:["His mentor","Elvin Stakman, the plant pathologist who steered him into fighting crop disease"],
  satsang:["You need to think beyond yourself.","5:05"],
  links:[["Nobel Prize","The Green Revolution, Peace, and Humanity, his 1970 Nobel lecture","https://nobelprize.org/prizes/peace/1970/borlaug/lecture","Why he believed bread and peace go together.","Primary source"],["University of Minnesota","About Norm","https://borlaugmemoriallecture.umn.edu/about-norm","From his alma mater, including his mentor Stakman.","Institution"],W("Norman_Borlaug")],
  books:["The Man Who Fed the World, Leon Hesser"]},
 {slug:"frankl",name:"Viktor Frankl",years:"1905–1997",era:"past",field:"Science",where:"Vienna, Austria · psychiatrist",icon:"compass",color:"lilac",
  beyond:"Kept his inner freedom inside the camps.",
  story:"A young psychiatrist in Vienna, he was deported with his family in 1942 and survived several camps, including Auschwitz. His parents, brother and wife did not. He noticed that those with a reason to live endured longest. After liberation he wrote Man's Search for Meaning in nine days. His conclusion: everything can be taken from a person except the choice of how to respond.",
  facts:["Survived Theresienstadt, Auschwitz and Dachau subcamps","Founded logotherapy, therapy through meaning","Wrote his famous book in 1946"],
  circle:["Early influences","Corresponded with Sigmund Freud as a teenager, then studied with Alfred Adler"],
  satsang:["'I'm not confined to this.'","8:37"],
  links:[["Viktor Frankl Institute, Vienna","Standard biography","https://viktorfrankl.org/standard_vitae.html","From the institute that holds his archive.","Institution"],["NPR","Viktor Frankl obituary, 1997","https://www.npr.org/1997/09/03/1038446/frankl-obit","Radio obituary from the week he died.","Audio"],["Britannica","Viktor Frankl","https://www.britannica.com/biography/Viktor-Frankl","A careful, edited biography.","Reference"]],
  books:["Man's Search for Meaning, Viktor Frankl"]},
 {slug:"nightingale",name:"Florence Nightingale",years:"1820–1910",era:"past",field:"Science",where:"England · nurse and statistician",icon:"lamp",color:"blush",
  beyond:"Turned a lamp and a column of numbers into a revolution in care.",
  story:"Born to wealth, she chose nursing against her family's wishes. In the Crimean War she led nurses at Scutari, walking the wards at night with a lamp. Back home she used statistics, and a new kind of chart called the rose diagram, to show that most soldiers had died of preventable disease, not wounds. Hospitals changed because of her numbers.",
  facts:["Led nurses at Scutari during the Crimean War","Invented the polar area or rose diagram","Opened a nursing school at St Thomas' Hospital, London, in 1860"],
  circle:["Her collaborator","William Farr, the statistician who helped her prove her case"],
  satsang:["Lofty talks is one thing... And when circumstances arise...","23:50"],
  links:[["Science Museum Group Journal","A statistical campaign: Florence Nightingale and Harriet Martineau's England and her Soldiers","https://journal.sciencemuseum.ac.uk/article/nightingale-and-martineau/","Peer-reviewed article on how she used data to force reform.","Journal"],["Project Gutenberg","Notes on Nursing: What It Is, and What It Is Not (1859)","https://www.gutenberg.org/ebooks/12439","Her own book, still readable today.","Primary source"],W("Florence_Nightingale")],
  books:["Notes on Nursing, Florence Nightingale"]},

 {slug:"dhawan",name:"Satish Dhawan",years:"1920–2002",era:"modern",field:"Engineering & tech",where:"India · aerospace engineer, ISRO chairman",icon:"satellite",color:"sky",
  beyond:"Took the blame for failure. Gave away the credit for success.",
  story:"When India's first satellite launch vehicle crashed into the sea in 1979, Kalam, the project director, wanted to resign. The ISRO chairman persuaded him to stay, faced the press himself and backed his team. When it reached orbit a year later, he stayed in the background and sent Kalam to speak. Kalam later called it the most important management lesson of his life.",
  facts:["Chairman of ISRO from 1972","Called the father of experimental fluid dynamics research in India","India's spaceport at Sriharikota is named after him"],
  circle:["Whom he mentored","A. P. J. Abdul Kalam and Roddam Narasimha, among many"],
  satsang:["To think beyond yourself, you need someone to inspire you.","22:04"],
  links:[["National Academy of Engineering","Memorial tribute to Satish Dhawan, by Roddam Narasimha and V. Siddhartha","https://www.nationalacademies.org/read/21785/chapter/18","Eight pages by two colleagues: Caltech, IISc, and building ISRO.","Long read"],["Current Science","Roddam Narasimha's obituary of Kalam (2015)","https://libjncir.jncasr.ac.in/jspui/bitstream/10572/1970/1/248.pdf","Includes what Dhawan did after the 1979 failure: 'I am going to put Kalam in orbit!'","Journal"],W("Satish_Dhawan")],
  books:["Wings of Fire, A. P. J. Abdul Kalam"]},
 {slug:"kurien",name:"Verghese Kurien",years:"1921–2012",era:"modern",field:"Engineering & tech",where:"Anand, India · dairy engineer",icon:"can",color:"sun",
  beyond:"Wanted to leave. A farmer leader asked him to stay.",
  story:"Posted to a government creamery he wanted to quit, the young engineer spent his evenings fixing equipment for Tribhuvandas Patel's small farmers' cooperative. Patel persuaded him to stay. It became Amul, owned by the farmers themselves. By 1998 India was the world's largest milk producer. When filmmaker Shyam Benegal needed money for Manthan, half a million farmers paid two rupees each.",
  facts:["Built Amul with farmer-owned cooperatives","Led the National Dairy Development Board from 1965","Operation Flood made India the largest milk producer by 1998"],
  circle:["His mentor","Tribhuvandas Patel, the cooperative leader who asked him to stay"],
  satsang:["All great people had a mentor in life.","21:49"],
  links:[["World Food Prize","Dr. Verghese Kurien, 1989 laureate","https://www.worldfoodprize.org/en/laureates/19871999_laureates/1989_kurien/","Why he won the prize often called the Nobel of food.","Institution"],["NDDB","Dr. Verghese Kurien","https://www.nddb.coop/about/chairman/vkurien","From the National Dairy Development Board he built.","Institution"],W("Verghese_Kurien")],
  books:["I Too Had a Dream, Verghese Kurien"]},
 {slug:"edison",name:"Thomas Edison",years:"1847–1931",era:"past",field:"Engineering & tech",where:"USA · inventor",icon:"bulb",color:"sun",
  beyond:"Treated failure as data, even when his life's work burned.",
  story:"Mostly schooled at home by his mother, he built a laboratory at Menlo Park in 1876 designed to invent on purpose. His team tested thousands of materials to make a practical light bulb, then built the power systems to light cities. In December 1914, at 67, a fire destroyed much of his West Orange works. As his son later told it, he watched the blaze and then began rebuilding at once.",
  facts:["Built the Menlo Park 'invention factory' in 1876","Held over 1,000 US patents","Rebuilt after the West Orange fire of 1914"],
  circle:["His first teacher","His mother, Nancy, who taught him at home"],
  satsang:["Only once in ten times you pass, that's also fine. Go on experimenting.","34:20"],
  links:[["National Park Service","Timeline of Edison and his inventions","https://www.nps.gov/edis/forkids/timeline-of-edison-and-his-inventions.htm","From the national park at his West Orange laboratory.","Institution"],W("Thomas_Edison")],
  books:["Edison: A Life of Invention, Paul Israel"]},
 {slug:"nakamura",name:"Tetsu Nakamura",years:"1946–2019",era:"modern",field:"Engineering & tech",where:"Japan to Afghanistan · doctor turned canal builder",icon:"drop",color:"sky",
  beyond:"Saw his patients needed water more than medicine, so he dug canals.",
  story:"He went to Peshawar in 1984 to treat leprosy patients. Years later, drought was killing more people than disease. So the doctor taught himself irrigation engineering, studied old Japanese river techniques, and led villagers in building a canal of over twenty kilometres. Desert in Nangarhar turned green and hundreds of thousands could farm again. He was killed in an attack in 2019.",
  facts:["Began treating patients in Pakistan in 1984","Led construction of the Marwarid canal in Nangarhar","Used traditional Japanese techniques villagers could maintain themselves"],
  satsang:["Try it! Experiment it!","42:25"],
  links:[["The Asia-Pacific Journal: Japan Focus","Nakamura Tetsu: humanitarian doctor, farmer, and hero of Afghanistan","https://apjjf.org/?p=19458","A thorough, sourced academic profile.","Journal"],W("Tetsu_Nakamura")],
  books:["Providence Was with Us, Tetsu Nakamura"]},

 {slug:"dr-v",name:"Dr. G. Venkataswamy",years:"1918–2006",era:"modern",field:"Leaders who gave back",where:"Madurai, India · eye surgeon",icon:"eye",color:"mint",
  beyond:"Started his life's work at 58, with crippled fingers.",
  story:"Rheumatoid arthritis twisted his hands, yet he learned cataract surgery and performed over 100,000 operations. At retirement he and his family mortgaged their homes to open an 11-bed hospital: six beds free, five paid. He began each morning in the meditation room. Aravind has since become the largest eye care provider in the world.",
  facts:["Opened Aravind with 11 beds in 1976","Paying patients fund free care for the rest","Started each day reading Sri Aurobindo"],
  circle:["His inspiration","Sri Aurobindo, after whom Aravind is named"],
  satsang:["Meaning? Do for God. Serve Him.","39:03"],
  links:[["Innovations (MIT Press), 2007","Aravind: Partner and Social Science Innovator, by Larry and Girija Brilliant","https://www.seva.ca/wp-content/uploads/mit_innovations_-_aravind.pdf","Two people who worked beside Dr. V for decades.","Journal"],["IIMB Management Review, 2006","Dr V: Social Entrepreneur and Management Guru","https://www.iimb.ac.in/imr/previous-issues/Social-Entrepreneur-sep-2006.php","A management school's tribute after his death.","Journal"],["Aravind","Our Story","https://aravind.org/our-story/","The hospital's own history.","Institution"],["YouTube","Infinite Vision","https://youtu.be/_mXVmGr2TCw","Short film linked from Aravind's own site.","Video"]],
  books:["Infinite Vision, Pavithra K. Mehta & Suchitra Shenoy"]},
 {slug:"amte",name:"Baba Amte",years:"1914–2008",era:"modern",field:"Leaders who gave back",where:"Maharashtra, India · Anandwan",icon:"well",color:"coral",
  beyond:"Ran from a dying leprosy patient. Then went back.",
  story:"A wealthy lawyer who drove fancy cars, he saw a man dying of leprosy by the road and fled in fear. He returned, fed him, and gave his life to such patients. In 1951 he moved onto rocky wasteland with his family, six patients and a lame cow, and built Anandwan, the Forest of Bliss. His motto: work builds, charity destroys.",
  facts:["Founded Anandwan in 1951","Injected himself with bacilli to show leprosy was not highly contagious","Ramon Magsaysay Award, 1985"],
  circle:["His inspiration","Mahatma Gandhi, whose follower he became"],
  satsang:["You start subtracting so much and you start creating oneness.","30:24"],
  links:[["Ramon Magsaysay Award, 1985","Citation and his acceptance speech","https://rmaward.asia/rmawardees/amte-murlidhar-devidas/","His speech, written while bedridden, is extraordinary.","Primary source"],W("Baba_Amte")],},
 {slug:"mandela",name:"Nelson Mandela",years:"1918–2013",era:"modern",field:"Leaders who gave back",where:"South Africa · leader",icon:"key",color:"sun",
  beyond:"Walked out of 27 years in prison without bitterness.",
  story:"Jailed for fighting apartheid, he spent 27 years in prison, most of them on Robben Island. Released in 1990, he chose reconciliation over revenge, invited his former jailer to his inauguration, and became the first president of a democratic South Africa.",
  facts:["27 years in prison","Released in 1990","Nobel Peace Prize, 1993"],
  circle:["His mentor","Walter Sisulu, who guided him into public life"],
  satsang:["He speaks badly of you and you feel, 'Poor thing, he seems miserable.'","33:16"],
  links:[["Nobel Prize","Nelson Mandela's Nobel lecture, 1993","https://www.nobelprize.org/prizes/peace/1993/mandela/lecture/","His own words, the year before he became president.","Primary source"],["Nobel Prize","Nelson Mandela, facts","https://www.nobelprize.org/prizes/peace/1993/mandela/facts/","Key dates from the Nobel Foundation.","Institution"],W("Nelson_Mandela")],

 {slug:"farmer",name:"Paul Farmer",years:"1959–2022",era:"modern",field:"Leaders who gave back",where:"USA to Haiti and Rwanda · doctor",icon:"house",color:"mint",
  beyond:"Refused to accept that the poor deserve lesser medicine.",
  story:"As a student he went to rural Haiti and never really left. He co-founded Partners In Health in 1987 and spent his life bringing world-class care to the poorest places, often walking hours to see a single patient. He died in Rwanda in 2022, still working.",
  facts:["Co-founded Partners In Health in 1987","Worked in Haiti, Rwanda, Peru and beyond","Died in Rwanda in 2022"],
  satsang:["One needs to think bigger, larger than himself.","5:48"],
  links:[["Partners In Health","The Good Doctor, Tracy Kidder's New Yorker profile (2000)","https://pih.org/article/the-good-doctor","Links to the profile that became Mountains Beyond Mountains.","Long read"],["Partners In Health","Remembering Dr. Paul Farmer","https://pih.org/article/remembering-dr-paul-farmer","From the organisation he built.","Institution"],W("Paul_Farmer")],
  books:["Mountains Beyond Mountains, Tracy Kidder"]},
 {slug:"maathai",name:"Wangari Maathai",years:"1940–2011",era:"modern",field:"Leaders who gave back",where:"Kenya · Green Belt Movement",icon:"tree",color:"mint",
  beyond:"Started with a few seedlings and village women.",
  story:"The first woman in East and Central Africa to earn a doctorate, she noticed streams drying and families short of firewood. In 1977 she began paying rural women to plant trees. The Green Belt Movement planted tens of millions, and she was beaten and jailed for standing up to land grabs. In 2004 she became the first African woman to win the Nobel Peace Prize.",
  facts:["Founded the Green Belt Movement in 1977","First woman in East and Central Africa to earn a PhD","Nobel Peace Prize, 2004"],
  satsang:["Slowly, slowly, you have to become strong... Nothing is going to happen overnight.","23:58"],
  links:[["Nobel Prize","Wangari Maathai's Nobel lecture, 2004","https://www.nobelprize.org/prizes/peace/2004/maathai/lecture/","Trees, democracy and peace, in her words.","Primary source"],["Nobel Prize","Wangari Maathai, biographical","https://nobelprize.org/prizes/peace/2004/maathai/biographical","Her autobiographical note for the Nobel Foundation.","Primary source"],W("Wangari_Maathai")],
  books:["Unbowed, Wangari Maathai"]},
 {slug:"sendler",name:"Irena Sendler",years:"1910–2008",era:"modern",field:"Leaders who gave back",where:"Warsaw, Poland · social worker",icon:"jar",color:"coral",
  beyond:"Hid children's real names in jars under an apple tree.",
  story:"Using her social-work pass to enter the Warsaw Ghetto, she and her network smuggled about 2,500 Jewish children out in ambulances, toolboxes and sacks. She wrote their real names on lists and buried them in jars so families could find them later. Arrested and tortured, she never gave anyone up.",
  facts:["Helped rescue about 2,500 children","Buried their identities in jars","Recognised as Righteous Among the Nations in 1965"],
  circle:["Her first teacher","Her father, a doctor who treated poor Jewish patients and told her to help anyone drowning"],
  satsang:["You need to go beyond yourself.","5:12"],
  links:[["Yad Vashem","Irena Sendler, Righteous Among the Nations","https://collections.yadvashem.org/en/righteous/4017433","The official record from Israel's Holocaust memorial.","Institution"],["Polish Righteous (POLIN Museum)","Irena Sendler's biography","https://sprawiedliwi.org.pl/en/node/17649","A full, careful biography.","Long read"],W("Irena_Sendler")],
  books:["Irena's Children, Tilar J. Mazzeo","Life in a Jar, Jack Mayer"]},
 {slug:"edhi",name:"Abdul Sattar Edhi",years:"1928–2016",era:"modern",field:"Leaders who gave back",where:"Karachi, Pakistan · humanitarian",icon:"ambulance",color:"sky",
  beyond:"Ran the country's largest ambulance network and lived with almost nothing.",
  story:"He begged on street corners to buy his first ambulance. From there he built a network of ambulances, shelters, orphanages and morgues for anyone of any faith, refusing government money. He owned two sets of clothes and lived in a small room beside his office.",
  facts:["Built Pakistan's largest volunteer ambulance service","Served anyone regardless of religion","Refused government and foreign funding"],
  circle:["His first teacher","His mother, who taught him to give half of what he had"],
  satsang:["You start thinking beyond this 'I', beyond this 'my'.","29:14"],
  links:[["Dawn","Obituary: Lifelong mission of mercy","https://dawn.com/news/1269692","Pakistan's paper of record on his life.","Long read"],W("Abdul_Sattar_Edhi")],
  books:["A Mirror to the Blind, Abdul Sattar Edhi"]},
 {slug:"sullivan",name:"Anne Sullivan",years:"1866–1936",era:"past",field:"Leaders who gave back",where:"Massachusetts, USA · teacher",icon:"pump",color:"lilac",
  beyond:"A half-blind teacher who reached a child no one could.",
  story:"Raised in a poorhouse and nearly blind herself, she graduated from Perkins School for the Blind and went to teach a wild, deaf-blind seven-year-old named Helen Keller. At a water pump she spelled w-a-t-e-r into Helen's hand, and the girl understood that things have names. She stayed beside Helen for almost fifty years.",
  facts:["Graduated from Perkins School for the Blind in 1886","Began teaching Helen Keller in 1887","Was her companion for 49 years"],
  circle:["Whom she inspired","Helen Keller, who went on to graduate from college and write a dozen books"],
  satsang:["The Guru gives intimations of the ultimate reality. He can't give experience.","26:25"],
  links:[["Project Gutenberg","The Story of My Life, by Helen Keller (1903)","https://www.gutenberg.org/ebooks/2397","Includes Anne Sullivan's own letters from the first months of teaching.","Primary source"],["Perkins School for the Blind","Anne Sullivan","https://www.perkins.org/anne-sullivan/","From the school where she trained.","Institution"],W("Anne_Sullivan")],
  books:["The Story of My Life, Helen Keller","The Miracle Worker, William Gibson"]},
 {slug:"schweitzer",name:"Albert Schweitzer",years:"1875–1965",era:"past",field:"Leaders who gave back",where:"Alsace to Gabon · doctor and musician",icon:"organ",color:"sun",
  beyond:"A celebrated organist who retrained as a doctor at 30.",
  story:"He was already a famous organist and theologian when he decided to study medicine so he could serve in Africa. In 1913 he and his wife Hélène opened a hospital at Lambaréné, in today's Gabon, and he ran it for decades, giving organ concerts in Europe to fund it. He called his ethic reverence for life.",
  facts:["Opened his hospital at Lambaréné in 1913","Expert on Bach and organ building","Nobel Peace Prize, 1952"],
  circle:["His organ teacher","Charles-Marie Widor in Paris"],
  satsang:["O King! I sing for you. He sings for God.","42:00"],
  links:[["Nobel Prize","The Problem of Peace, his Nobel lecture","https://www.nobelprize.org/prizes/peace/1952/schweitzer/lecture/","His own words on reverence for life and peace.","Primary source"],["Nobel Prize","Albert Schweitzer, biographical","https://www.nobelprize.org/prizes/peace/1952/schweitzer/biographical/","The official account.","Institution"],W("Albert_Schweitzer")],
  books:["Out of My Life and Thought, Albert Schweitzer"]}

P("mahavira","Bhagwan Mahavira","c. 599–527 BCE (Jain tradition)","past","Spiritual","Bihar, India · 24th Tirthankara","diya","blush",
 "A prince who gave up a kingdom to conquer the self.",
 "Born a prince named Vardhamana, He renounced His home at thirty and spent over twelve years in silence, fasting and meditation. In one well-known episode a cowherd drove nails into His ears, and He remained in equanimity. After attaining omniscience He taught non-violence, non-attachment and the many-sidedness of truth, anekantavada.",
 ["Renounced His kingdom at thirty","Attained kevala jnana, omniscience, after more than twelve years of austerity","Taught ahimsa, aparigraha and anekantavada"],
 ["What He inspires","Jindasha in the satsang: contemplating His flawless state until you want to try it yourself"],"mahavira",
 [BR("Mahavira-Jaina-teacher","Mahavira"),["YouTube","Satsang on Verse 135: Jindasha","https://youtu.be/8Cp1bDsXCrU","The satsang explains why contemplating His state is a cause of liberation.","Primary source"],W("Mahavira")],
 ["Acharanga Sutra","Kalpa Sutra"]);
P("buddha","Gautama Buddha","c. 5th century BCE","past","Spiritual","Lumbini to Kushinagar · the Awakened One","leaf","mint",
 "A prince who saw old age, sickness and death, and walked out to find the way beyond them.",
 "Siddhartha grew up shielded in a palace. Seeing an old man, a sick man, a corpse and a wandering ascetic, he left home to understand suffering. After years of extreme austerity he chose a middle way, sat beneath the bodhi tree at Bodh Gaya, and awoke. He then taught for some forty-five years, beginning at Sarnath.",
 ["Left the palace at about twenty-nine","Awakened under the bodhi tree at Bodh Gaya","First sermon at Sarnath on the Four Noble Truths"],
 ["What moved him","The four sights: an old man, a sick man, a corpse and a renunciant"],"sorrow",
 [GUT(2017,"The Dhammapada, translated by F. Max Müller","His teachings in verse, one of the oldest Buddhist texts."),BR("Buddha-founder-of-Buddhism","Buddha"),W("The_Buddha")],
 ["The Dhammapada","Old Path White Clouds, Thich Nhat Hanh"]);
P("kabir","Sant Kabir","15th century","past","Spiritual","Varanasi, India · weaver and poet-saint","stamp","sun",
 "A weaver who never wrote a line, yet his couplets are still sung across India.",
 "Kabir worked a loom in Varanasi. The story goes that he lay on the ghat steps before dawn so the saint Ramananda would step on him and say Ram's name, and took that as his initiation. His spoken dohas mocked empty ritual in both Hindu and Muslim practice and pointed to the God within. Both communities claimed him at his death.",
 ["Earned his living as a weaver","His verses are included in the Guru Granth Sahib","Taught that the divine is within, beyond ritual and caste"],
 ["His Guru, by tradition","Ramananda"],"subtract",
 [GUT(6519,"Songs of Kabir, translated by Rabindranath Tagore","One hundred of his poems, chosen and translated by Tagore."),["Poetry Foundation","Kabir","https://poetryfoundation.org/poets/kabir","A literary introduction with poems.","Long read"],W("Kabir")],
 ["Songs of Kabir, Rabindranath Tagore","The Weaver's Songs, Vinay Dharwadker"]);
P("nanak","Guru Nanak Dev Ji","1469–1539","past","Spiritual","Punjab · founder of the Sikh faith","sun","sun",
 "Vanished into a river for three days and came back speaking of one God for all.",
 "Nanak worked as a storekeeper at Sultanpur Lodhi. One morning he went to bathe in the Bein river and did not return for three days. When he came back his first words, as tradition records, were that there is no Hindu and no Muslim. He spent years walking across South Asia and beyond with the musician Mardana, singing his message, then settled at Kartarpur, where everyone farmed and ate together.",
 ["Experienced his calling in the Bein river at Sultanpur Lodhi","Travelled for years with the musician Bhai Mardana","Founded Kartarpur, with the shared kitchen, langar"],
 ["His companion","Bhai Mardana, who played the rabab as he sang"],"oneness",
 [BR("Guru-Nanak","Guru Nanak"),W("Guru_Nanak")],
 ["Japji Sahib","Guru Nanak: His Life and Teachings, Harbans Singh"]);
P("gandhi","Mahatma Gandhi","1869–1948","past","Spiritual","Porbandar, India · lawyer turned Mahatma","charkha","coral",
 "Thrown off a train for his skin, he chose to stay and fight with truth instead of anger.",
 "In 1893 a young lawyer was thrown off a first-class train at Pietermaritzburg in South Africa. He spent that cold night in the waiting room deciding whether to go home, and chose to stay and resist injustice. Over the next fifty years he turned truth and non-violence into tools that moved millions. Shrimad Rajchandraji was, in his words, his refuge in spiritual crisis.",
 ["Thrown off a train at Pietermaritzburg in 1893","Led the Salt March in 1930","Wrote his autobiography as The Story of My Experiments with Truth"],
 ["Who shaped him","Shrimad Rajchandraji by living contact, Tolstoy by a book, and Ruskin's Unto This Last"],"paradigm",
 [["Standard Ebooks","The Story of My Experiments with Truth, full text","https://standardebooks.org/ebooks/mahatma-gandhi/the-story-of-my-experiments-with-truth","His autobiography, in Mahadev Desai's translation.","Primary source"],["Gandhi's autobiography","The chapter \"Raychandbhai\"","https://franpritchett.com/00litlinks/gandhi/part2/printingtext_201_210.html","Includes the Pietermaritzburg night.","Primary source"],W("Mahatma_Gandhi")],
 ["The Story of My Experiments with Truth, M. K. Gandhi","Gandhi Before India, Ramachandra Guha"]);
P("ramana","Ramana Maharshi","1879–1950","past","Spiritual","Tiruvannamalai, India · sage of Arunachala","mountain","lilac",
 "At sixteen he lay down, acted out his own death, and asked who dies.",
 "In 1896 a schoolboy in Madurai was seized by a sudden fear of death. He lay down, held his breath, and inquired: the body dies, but who am I? The answer changed him for good. Weeks later he left home for the hill of Arunachala and never left it. His teaching remained simple: ask yourself, who am I?",
 ["Self-realisation at sixteen in Madurai, 1896","Lived at Arunachala for fifty-four years","Taught self-inquiry: 'Who am I?'"],
 ["What drew him","The name and hill of Arunachala, which he had felt pulled toward since childhood"],"notbody",
 [["David Godman","Bhagavan's self-realisation","https://www.davidgodman.org/bhagavans-self-realisation/","The death experience, largely in his own words, by a leading scholar of his teaching.","Long read"],["Arunachala Ashrama","Ramana Maharshi life timeline","https://arunachala.org/sri-ramana-maharshi/ramana-maharshi-life-timeline/","A careful year-by-year timeline.","Institution"],W("Ramana_Maharshi")],
 ["Who Am I?, Ramana Maharshi","Be As You Are, David Godman"]);
P("neem-karoli","Neem Karoli Baba","c. 1900–1973","past","Spiritual","Uttar Pradesh, India · Maharaj-ji","tree","mint",
 "A saint in a plaid blanket who changed a Harvard professor and inspired Silicon Valley.",
 "Known simply as Maharaj-ji, he taught little in words: love everyone, serve everyone, remember God. In 1967 Richard Alpert, a Harvard psychologist, met him and came home as Ram Dass, whose book Be Here Now reached millions. In 1974 a young Steve Jobs travelled to his Kainchi ashram hoping to meet him, not knowing he had died the year before.",
 ["Ashrams at Kainchi and Vrindavan","Transformed Richard Alpert into Ram Dass in 1967","Steve Jobs visited Kainchi in 1974"],
 ["Whom he inspired","Ram Dass, Krishna Das, Larry Brilliant, and through them many more"],"letself",
 [W("Neem_Karoli_Baba"),W("Ram_Dass")],
 ["Miracle of Love, Ram Dass","Be Here Now, Ram Dass"]);
P("teresa","Mother Teresa","1910–1997","past","Spiritual","Skopje to Kolkata · Missionaries of Charity","heart","sky",
 "Heard a 'call within a call' on a train, and left her school for the streets.",
 "A teacher at a convent school in Calcutta, she was travelling by train to Darjeeling in September 1946 when she felt called to serve the poorest of the poor. She left the convent, learned basic nursing, and began working in the slums. In 1950 she founded the Missionaries of Charity, which cared for the dying, lepers and abandoned children.",
 ["Her 'call within a call' came on 10 September 1946","Founded the Missionaries of Charity in 1950","Nobel Peace Prize, 1979"],
 ["Whom she inspired","Among many, Dr. Devi Shetty, who was her heart surgeon"],"serve",
 [NOB("peace/1979/teresa/biographical/","Mother Teresa, biographical","The Nobel Foundation's account.","Institution"),NOB("peace/1979/teresa/lecture/","Mother Teresa's Nobel lecture, 1979","Her own words in Oslo."),W("Mother_Teresa")],
 ["Come Be My Light, Mother Teresa"]);
P("thich","Thich Nhat Hanh","1926–2022","modern","Spiritual","Vietnam to France · Zen teacher","bell","lilac",
 "Exiled for working for peace, he taught the world to breathe and walk mindfully.",
 "A Vietnamese monk, he founded relief work in villages bombed during the war and called for peace on both sides. In 1966 he was exiled for it and spent nearly forty years away from home. Martin Luther King Jr. nominated him for the Nobel Peace Prize. He founded Plum Village in France and returned to his root temple in Hue to die.",
 ["Exiled from Vietnam in 1966","Nominated for the Nobel Peace Prize by Martin Luther King Jr. in 1967","Founded Plum Village in France in 1982"],
 ["Whom he inspired","Martin Luther King Jr., who called him an apostle of peace"],"equan",
 [["Plum Village","The life story of Thich Nhat Hanh","https://plumvillage.org/about/thich-nhat-hanh/biography/","From the community he founded.","Biography"],W("Thich_Nhat_Hanh")],
 ["The Miracle of Mindfulness, Thich Nhat Hanh","Peace Is Every Step, Thich Nhat Hanh"]);
P("rumi","Jalaluddin Rumi","1207–1273","past","Spiritual","Balkh to Konya · poet and mystic","whirl","coral",
 "A respected scholar until a wandering dervish turned his world upside down.",
 "Rumi was a learned teacher of law and theology in Konya. In 1244 he met Shams of Tabriz, a wild, wandering mystic, and the two became inseparable. When Shams vanished, Rumi's grief poured out as poetry and music. He went on to compose the Masnavi, some 25,000 couplets that are still read across the world.",
 ["Met Shams of Tabriz in 1244","Composed the Masnavi, about 25,000 couplets","His followers became the Mevlevi order, the whirling dervishes"],
 ["His spiritual companion","Shams of Tabriz"],"seeone",
 [BR("Rumi","Rumi"),["Dar al-Masnavi","About the Masnavi","https://dar-al-masnavi.org/about_masnavi.html","A scholarly guide to his great work and Nicholson's translation.","Scholarly"],["Poetry Foundation","Jalal al-Din Rumi","https://poetryfoundation.org/poets/jalal-al-din-rumi","A literary introduction with poems.","Long read"]],
 ["The Masnavi, translated by Jawid Mojaddedi","Rumi: Past and Present, East and West, Franklin Lewis"]);
P("khusro","Amir Khusro","1253–1325","past","Arts & music","Delhi, India · poet and musician","note","blush",
 "A court poet whose heart belonged to his Sufi master.",
 "Khusro served several sultans of Delhi as a court poet, writing in Persian and in the Hindavi spoken on the street. His deepest bond was with the Sufi saint Nizamuddin Auliya. Tradition credits him with shaping qawwali and much of North Indian music. When his master died, Khusro followed within months and was buried near him.",
 ["Wrote in Persian and Hindavi","Disciple of Nizamuddin Auliya","Traditionally credited with shaping qawwali"],
 ["His master","Hazrat Nizamuddin Auliya"],"bhakti",
 [["Encyclopaedia Iranica","Amir Kosrow: the poet","https://iranicaonline.org/articles/amir-kosrow-poet","The scholarly reference on his life and work.","Scholarly"],W("Amir_Khusrau")],
 ["In the Bazaar of Love: Selected Poetry of Amir Khusrau, translated by Paul Losensky and Sunil Sharma"]);
P("laozi","Laozi","c. 6th century BCE (traditional)","past","Spiritual","China · sage of the Tao","drop","sky",
 "Leaving the world, he was asked to write down what he knew, and left 81 short chapters.",
 "Little is certain about him. The traditional story says he kept the archives of the Zhou court and, seeing its decline, rode west toward the mountains. A gatekeeper at the border pass begged him to leave his wisdom behind, and he wrote the Tao Te Ching: on yielding like water, acting without forcing, and the strength of softness.",
 ["Traditionally the author of the Tao Te Ching","One of the most translated books in the world","Founder figure of Taoism"],
 ["Who asked him to write","By legend, Yinxi, the keeper of the western pass"],"notbody",
 [GUT(216,"The Tao Teh King, translated by James Legge","The full text."),W("Laozi")],
 ["Tao Te Ching, translated by Stephen Mitchell"]);

P("einstein","Albert Einstein","1879–1955","past","Science","Ulm to Princeton · physicist","emc","sky",
 "A patent clerk who changed how we see space and time.",
 "At four or five, his father showed him a compass, and he was amazed that something invisible moved the needle. Unable to find a university post, he worked as a patent clerk in Bern. In 1905, in his spare time, he published four papers that reshaped physics, including special relativity and E = mc². He kept the curiosity of that child with the compass all his life.",
 ["Worked as a patent clerk in Bern","Published four landmark papers in 1905","Nobel Prize in Physics, 1921"],
 ["What sparked him","A compass his father showed him as a small child"],"prism",
 [["Nobel Prize","Albert Einstein, the Nobel Prize in Physics 1921","https://www.nobelprize.org/prizes/physics/1921/einstein/","The Nobel Foundation's pages on him.","Institution"],MT("Einstein","Albert Einstein"),W("Albert_Einstein")],
 ["Einstein: His Life and Universe, Walter Isaacson"]);
P("ramanujan","Srinivasa Ramanujan","1887–1920","past","Science","Kumbakonam, India · mathematician","infinity","sun",
 "A clerk with no degree mailed his theorems to Cambridge, and one man wrote back.",
 "At fifteen he found an old book of formulas, Carr's Synopsis, and worked through it alone. He failed college because he ignored every subject but mathematics, and took a clerk's job at the Madras Port Trust. In 1913 he wrote to G. H. Hardy with pages of results. Hardy brought him to Cambridge. He died at thirty-two, leaving notebooks mathematicians still study.",
 ["Self-taught from Carr's Synopsis","Wrote to G. H. Hardy in 1913","Fellow of the Royal Society at thirty"],
 ["His mentor","G. H. Hardy at Cambridge"],"mentor",
 [MT("Ramanujan","Srinivasa Ramanujan"),["MacTutor archive","Hardy's obituary of Ramanujan, Proceedings of the London Mathematical Society","https://mathshistory.st-andrews.ac.uk/LMS/ramanujan_lms_obit.pdf","Written by the man who discovered him.","Primary source"],W("Srinivasa_Ramanujan")],
 ["The Man Who Knew Infinity, Robert Kanigel"]);
P("raman","C. V. Raman","1888–1970","past","Science","Tiruchirappalli, India · physicist","prism","sky",
 "An accountant by day, a physicist by night, and India's first Nobel in science.",
 "With no post in science, Raman joined the government finance service in Calcutta and did research in the evenings at the Indian Association for the Cultivation of Science. On a voyage to Europe in 1921 he wondered why the sea is blue. That question led to the Raman effect in 1928, and the Nobel Prize in 1930, won with simple, home-built equipment.",
 ["Did his early research in the evenings after his government job","Discovered the Raman effect on 28 February 1928","Nobel Prize in Physics, 1930"],
 ["Whom he inspired","Vikram Sarabhai and Homi Bhabha, who both worked under him at IISc"],"science",
 [NOB("physics/1930/raman/biographical/","C. V. Raman, biographical","The Nobel Foundation's account.","Institution"),W("C._V._Raman")],
 ["Journey into Light, G. Venkataraman"]);
P("jc-bose","Jagadish Chandra Bose","1858–1937","past","Science","Bengal, India · physicist and biologist","leaf","mint",
 "Pioneered radio waves, then showed that plants respond to the world.",
 "Bose built some of the earliest devices for millimetre-wave radio in the 1890s and was reluctant to patent his work, preferring it be free. He then turned to plants, inventing the crescograph to measure tiny growth and showing that plants respond to stimuli. He founded the Bose Institute in Kolkata in 1917.",
 ["Early pioneer of millimetre-wave radio","Invented the crescograph","Founded the Bose Institute in 1917"],
 ["His teacher","Father Eugene Lafont at St. Xavier's, Calcutta"],"higher",

P("sadhguru","Sadhguru","b. 1957","modern","Spiritual","Mysuru, India · yogi, founder of Isha Foundation","drop","mint",
 "Sat on a rock on Chamundi Hill at twenty-five and came down a different man.",
 "Jagadish Vasudev learned simple yoga as a boy from Malladihalli Raghavendra Swamiji and later ran businesses in Mysuru. On 23 September 1982 he rode up Chamundi Hill, sat on a rock, and had an experience that he says dissolved the line between himself and everything around him. He began teaching yoga and in 1992 founded the Isha Foundation near Coimbatore. He has led large public campaigns such as Rally for Rivers and Save Soil.",
 ["Experience on Chamundi Hill, 23 September 1982","Founded the Isha Foundation in 1992","Led Rally for Rivers in 2017 and Save Soil in 2022"],
 ["His first teacher","Malladihalli Raghavendra Swamiji, who taught him yoga as a child"],"tired",
 [W("Sadhguru")],["Inner Engineering, Sadhguru"]);
P("patel","Sardar Vallabhbhai Patel","1875–1950","past","Leaders who gave back","Nadiad, India · the Iron Man of India","key","sky",
 "A sharp lawyer who once laughed at Gandhi, then united a nation.",
 "Born in Nadiad, Patel studied law in London and became a successful barrister in Ahmedabad, at first dismissive of Gandhi's methods. Seeing Gandhi's work, he joined the Kheda satyagraha in 1918 and gave his life to the freedom movement. After leading the Bardoli satyagraha in 1928, the farmers' women gave him the title Sardar. As India's first Home Minister he brought over 560 princely states into the union.",
 ["Led the Bardoli satyagraha in 1928","India's first Deputy Prime Minister and Home Minister","Integrated over 560 princely states into India"],
 ["His mentor","Mahatma Gandhi"],"pull",
 [W("Vallabhbhai_Patel")],["Patel: A Life, Rajmohan Gandhi"]);
P("ratan-tata","Ratan Tata","1937–2024","modern","Leaders who gave back","Mumbai, India · industrialist and philanthropist","car","sun",
 "Saw a family of four on one scooter in the rain, and built a car for them.",
 "Raised largely by his grandmother Navajbai, Ratan Tata trained as an architect and started on the shop floor at Tata Steel. He took over the group in 1991 and made it global, buying Jaguar Land Rover in 2008, years after Ford executives had belittled his car ambitions. Moved by families squeezed onto scooters, he launched the Nano. Most of Tata Sons is owned by the Tata Trusts, so much of the group's profit goes to charity.",
 ["Chairman of the Tata group from 1991 to 2012","Launched the Tata Nano in 2008","Tata Trusts hold most of Tata Sons, funding health and education"],
 ["His mentors","J. R. D. Tata, and his grandmother Navajbai, who raised him"],"higher",
 [W("Ratan_Tata")],["Ratan N. Tata: The Authorized Biography, Thomas Mathew"]);

P("keller","Helen Keller","1880–1968","past","Leaders who gave back","Tuscumbia, Alabama · author and advocate","hand","sky",
 "Deaf and blind from nineteen months, she found the word 'water' under a pump and never stopped learning.",
 "An illness at nineteen months left Helen deaf and blind, and she grew up wild and cut off. In March 1887 Anne Sullivan, a young teacher from the Perkins Institution who was herself nearly blind, arrived at the house. Weeks later, at the water pump, Sullivan spelled w-a-t-e-r into one hand while water ran over the other, and Helen understood that everything had a name. She went on to graduate from Radcliffe College in 1904, wrote books in English, and worked for the American Foundation for the Blind for forty-four years, campaigning for braille, education and work for blind people.",
 ["Anne Sullivan arrived in March 1887","Graduated from Radcliffe College in 1904, cum laude","Wrote The Story of My Life in 1903, while still a student","Worked with the American Foundation for the Blind for 44 years"],
 ["Her teacher","Anne Sullivan, who stayed beside her for nearly fifty years"],"prism",
 [GUT(2397,"The Story of My Life, Helen Keller","Her own account, written at twenty-two. Chapter IV is the day at the pump."),["American Foundation for the Blind","The Helen Keller Archive","https://afb.org/about-afb/history/helen-keller/helen-keller-archive","The world's largest collection of her letters, speeches, photographs and films.","Primary source"],["American Foundation for the Blind","Helen Keller's life and impact","https://afb.org/blog/entry/helen-kellers-life-and-impact","Her 44 years of advocacy, from the organisation she served.","Institution"],W("Helen_Keller")],
 ["The Story of My Life, Helen Keller","The World I Live In, Helen Keller","Helen and Teacher, Joseph P. Lash"]);

P("google","Google","founded 1998","org",ORG,"Menlo Park garage to Mountain View · search and beyond","search","sky",
 "Two students set out to organise the world's information, and wrote down what they believed.",
 "Larry Page and Sergey Brin met at Stanford, where Page's research project, BackRub, ranked web pages by the links pointing to them. In September 1998 they incorporated Google and moved into a rented garage in Menlo Park. Their mission was to organise the world's information and make it universally accessible and useful. Early on they wrote down a short list of beliefs, starting with 'Focus on the user and all else will follow'. Years later, Google's own research on its teams, Project Aristotle, found that how a team works together matters more than who is on it.",
 ["Incorporated in September 1998, in a Menlo Park garage","Mission: organise the world's information and make it universally accessible and useful","Project Aristotle found psychological safety mattered most in its teams"],
 ["Who started it","Larry Page and Sergey Brin, two Stanford PhD students"],"inspire",
 [["Google","Ten things we know to be true","https://about.google/philosophy","The company's own statement of its beliefs, first written in its early years.","Primary source"],["Google re:Work","Guide: understand team effectiveness (Project Aristotle)","https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness","Google's research into what makes its best teams work: psychological safety came first.","Primary source"],W("History_of_Google")],
 ["How Google Works, Eric Schmidt and Jonathan Rosenberg","In the Plex, Steven Levy","Work Rules!, Laszlo Bock"]);
P("olympics","The Olympic Games","revived 1896","org",ORG,"Athens 1896 · the modern Olympic movement","rings","sun",
 "A French educator believed sport could build character and peace, and revived a festival dead for 1,500 years.",
 "Pierre de Coubertin, born in Paris in 1863, was an educator convinced that sport shapes character and brings nations together. Inspired by the ancient Games at Olympia, which ended in 393 AD, he founded the International Olympic Committee in 1894, and the first modern Games were held in Athens in 1896. He designed the five interlaced rings in 1913, wrote the Olympic Charter and the athletes' oath, and led the IOC until 1925. When he died in 1937, his heart was laid to rest at Olympia.",
 ["IOC founded in 1894","First modern Games in Athens, 1896","Five rings designed by Coubertin in 1913","His heart is buried at Olympia"],
 ["Who started it","Pierre de Coubertin, educator and historian"],"everyday",
 [["International Olympic Committee","Who was Pierre de Coubertin?","https://olympics.com/ioc/faq/history-and-origin-of-the-games/who-was-pierre-de-coubertin","The founder's story from the IOC itself.","Institution"],["Britannica","Pierre, Baron de Coubertin: Father of the Modern Olympics","https://www.britannica.com/biography/Pierre-Baron-de-Coubertin-Father-of-the-Modern-Olympics","A careful, edited account of how the Games were revived.","Reference"],W("Olympic_Games")],
 ["Olympism: Selected Writings, Pierre de Coubertin","The Games: A Global History of the Olympics, David Goldblatt"]);
P("isro","ISRO","1962–","org",ORG,"Thumba, Kerala to the Moon · India's space agency","rocket","coral",
 "Began in a fishing village church, with rocket parts carried on bicycles.",
 "Vikram Sarabhai, backed by Homi Bhabha and Prime Minister Nehru, wanted India to use space for its farmers, schools and weather. Thumba, a fishing village near Thiruvananthapuram, was chosen because it sits near the magnetic equator. The bishop persuaded the local community to give up the St Mary Magdalene church, which became the office, while a new church was built nearby. On 21 November 1963 India's first sounding rocket rose from Thumba; famous photographs show parts moved by bicycle. ISRO was formed in 1969, and in 2023 Chandrayaan-3 landed near the Moon's south pole.",
 ["First rocket launched from Thumba, 21 November 1963","The old church became the office and is now a space museum","ISRO formed on 15 August 1969","Chandrayaan-3 landed near the lunar south pole in 2023"],
 ["Who started it","Vikram Sarabhai, with Homi Bhabha's backing"],"beyond",
 [["Live History India","ISRO: It's not just rocket science","https://livehistoryindia.com/story/eras/isro-its-not-rocket-science","Long read built on an interview with P. V. Manoranjan Rao, a former Group Director of the Vikram Sarabhai Space Centre.","Long read"],W("Thumba_Equatorial_Rocket_Launching_Station"),W("Indian_Space_Research_Organisation")],
 ["Ever Upwards: ISRO in Images, P. V. Manoranjan Rao, B. N. Suresh and V. P. Balagangadharan","Wings of Fire, A. P. J. Abdul Kalam","From Fishing Hamlet to Red Planet, P. V. Manoranjan Rao (ed.)"]);
P("jpl","NASA's Jet Propulsion Laboratory","founded 1936","org",ORG,"Arroyo Seco, Pasadena · robotic space exploration","satellite","lilac",
 "A handful of students tested rockets in a dry canyon, and their lab went on to touch every planet.",
 "In the 1930s Caltech graduate students led by Frank Malina, with a few local rocket enthusiasts and their professor Theodore von Kármán, kept having hazardous accidents on campus. They moved their experiments to the Arroyo Seco, a dry wash north of Pasadena, and first fired an alcohol-fuelled rocket motor on 31 October 1936. That group became the Jet Propulsion Laboratory. In 1958 it built Explorer 1, America's first satellite, which discovered the Van Allen radiation belts, and it went on to send spacecraft to every planet.",
 ["First rocket motor test on 31 October 1936","Built Explorer 1, launched 31 January 1958","Joined NASA in December 1958","Behind the Voyager probes and the Mars rovers"],
 ["Who started it","Frank Malina and fellow students, with Theodore von Kármán as mentor"],"expt",
 [["NASA JPL","History of JPL","https://www.jpl.nasa.gov/about/history","The lab's own history, from the Arroyo Seco to the planets.","Institution"],W("Jet_Propulsion_Laboratory")],
 ["Escape from Earth: A Secret History of the Space Rocket, Fraser MacDonald","The Wind and Beyond, Theodore von Kármán with Lee Edson"]);
P("toyota","Toyota Production System","from 1937","org",ORG,"Toyota City, Japan · lean manufacturing","loom","mint",
 "Began with a son who wanted to ease his mother's weaving, and built a culture of never-ending improvement.",
 "Sakichi Toyoda grew up watching his mother weave by hand and set out to make her work easier. His automatic loom stopped by itself when a thread broke, so no defective cloth was made. That idea, building judgment into the machine, became jidoka. His son Kiichiro, founder of the car company, added just-in-time: make only what is needed, when it is needed. Taiichi Ohno later shaped these into the Toyota Production System, where any worker can stop the line to fix a problem and people, not machines, drive kaizen, continuous improvement.",
 ["Jidoka: stop at the first sign of a problem","Just-in-time: make only what is needed, when needed","Kaizen: improvement every day, driven by people"],
 ["Who started it","Sakichi Toyoda, his son Kiichiro, and later Taiichi Ohno"],"everyday",
 [["Toyota","Toyota Production System","https://global.toyota/en/company/vision-and-philosophy/production-system/","Toyota's own explanation of jidoka, just-in-time and kaizen.","Primary source"],["Lean Enterprise Institute","Toyota Production System","https://www.lean.org/lexicon-terms/toyota-production-system/","The standard lean glossary entry.","Reference"],W("Toyota_Production_System")],
 ["Toyota Production System: Beyond Large-Scale Production, Taiichi Ohno","The Machine That Changed the World, Womack, Jones and Roos","The Toyota Way, Jeffrey Liker"]);
P("redcross","The Red Cross","founded 1863","org",ORG,"Geneva · humanitarian movement","redcross","blush",
 "A businessman saw a battlefield of dying men, and could not go home and forget it.",
 "In June 1859 Henry Dunant, a Geneva businessman, came upon the aftermath of the battle of Solferino in northern Italy. He organised local villagers to care for the wounded of both sides. Back home he wrote A Memory of Solferino, published in 1862, asking for trained volunteer relief societies and a treaty to protect the wounded. In 1863 a small committee in Geneva, with Dunant as secretary, began what became the International Committee of the Red Cross. In 1864 the first Geneva Convention was signed. Dunant shared the first Nobel Peace Prize in 1901.",
 ["Battle of Solferino, June 1859","A Memory of Solferino published in 1862","First Geneva Convention, 1864","Dunant shared the first Nobel Peace Prize, 1901"],
 ["Who started it","Henry Dunant, with four other Geneva citizens"],"oneness",
 [["ICRC","A Memory of Solferino, Henry Dunant","https://www.icrc.org/en/doc/assets/files/publications/icrc-002-0361.pdf","The book that started it all, published by the ICRC.","Primary source"],["ICRC","Founding and early years of the ICRC, 1863–1914","https://www.icrc.org/en/document/founding-and-early-years-icrc-1863-1914","The organisation's own history of its first fifty years.","Institution"],["Nobel Prize","Henry Dunant, facts","https://www.nobelprize.org/prizes/peace/1901/dunant/facts/","The first Peace Prize.","Institution"],W("International_Committee_of_the_Red_Cross")],
 ["A Memory of Solferino, Henry Dunant","Dunant's Dream, Caroline Moorehead"]);
P("msf","Doctors Without Borders (MSF)","founded 1971","org",ORG,"Paris · independent medical humanitarians","medkit","coral",
 "Doctors who refused to stay silent about what they saw.",
 "Médecins Sans Frontières was founded in France in 1971 by a group of doctors and journalists, in the wake of war and famine in Biafra, Nigeria. From the start, teams committed both to caring for patients and to bearing witness: speaking out about the causes behind the suffering they treat. They protect their independence by relying mostly on private donations. In 1999 MSF received the Nobel Peace Prize; in his lecture, James Orbinski used the moment to condemn the bombing of civilians in Chechnya.",
 ["Founded in 1971 by doctors and journalists","Bearing witness is part of the mission","Nobel Peace Prize, 1999"],
 ["Who started it","Thirteen founding members, doctors and journalists, including Bernard Kouchner"],"serve",
 [["Doctors Without Borders","Our history: founding","https://www.doctorswithoutborders.org/who-we-are/history/founding","Why and how it began, in its own words.","Institution"],NOB("peace/1999/msf/lecture/","Nobel lecture, James Orbinski, 1999","A doctor's case for humanitarian action and bearing witness."),W("M%C3%A9decins_Sans_Fronti%C3%A8res")],
 ["An Imperfect Offering, James Orbinski","Hope in Hell, Dan Bortolotti"]);
P("bell-labs","Bell Labs","1925–","org",ORG,"Murray Hill, New Jersey · the idea factory","chip","sun",
 "Put physicists, chemists and engineers in the same corridors, and the modern world came out.",
 "Bell Telephone Laboratories was formed in 1925 to do research for the phone system. Under leaders like Mervin Kelly it mixed theory with practice, put people from different fields side by side, and gave them freedom within a clear mission. From one building came the transistor in 1947, Claude Shannon's information theory in 1948, the first practical solar cell in 1954, and later Unix and the C language. Its scientists won several Nobel Prizes.",
 ["The transistor, 1947","Shannon's information theory, 1948","The silicon solar cell, 1954","Unix and C, around 1970"],
 ["Who shaped it","Mervin Kelly, who built its culture of mixed teams and long-range research"],"try",
 [["Issues in Science and Technology","Mother of Invention: review of The Idea Factory","https://issues.org/br_tenner-3/","Edward Tenner of the Smithsonian on what made Bell Labs work, and what eroded it.","Journal"],["Physics Today","Review: The Idea Factory","https://physicstoday.aip.org/reviews/the-idea-factory-bell-labs-and-the-great-age-of-american-innovation","Venkatesh Narayanamurti of Harvard on its 'circumscribed freedom' and lessons for today.","Journal"],W("Bell_Labs")],
 ["The Idea Factory, Jon Gertner","A Mind at Play, Jimmy Soni and Rob Goodman"]);
P("khan-academy","Khan Academy","founded 2008","org",ORG,"Mountain View, California · free education for anyone","play","mint",
 "Began with a cousin who needed help with maths.",
 "In 2004 Sal Khan, then working as a hedge fund analyst, began tutoring his cousin Nadia remotely, by phone and an online doodle tool, after she struggled with unit conversion. More relatives asked for help, so in 2006 he started putting short videos on YouTube so they could learn at their own pace. Strangers began watching too. In 2008 it became a nonprofit with a mission to provide a free, world-class education for anyone, anywhere.",
 ["Started with tutoring cousin Nadia in 2004","First YouTube videos in 2006","Became a nonprofit in 2008"],
 ["Who started it","Sal Khan"],"pull",
 [["Khan Academy","What is the history of Khan Academy?","https://support.khanacademy.org/hc/en-us/articles/202483180","The origin story in its own words.","Institution"],W("Khan_Academy")],
 ["The One World Schoolhouse, Salman Khan","Brave New Words, Salman Khan"]);
P("wikipedia","Wikipedia","founded 2001","org",ORG,"Everywhere · the free encyclopedia","globe","lilac",
 "An encyclopedia anyone can edit; everyone said it couldn't work.",
 "Jimmy Wales and Larry Sanger first tried Nupedia, an expert-written free encyclopedia that moved slowly. On 15 January 2001 they opened Wikipedia, a side project anyone could edit. Volunteers poured in. It runs on a few core principles, above all a neutral point of view and verifiable sources, and is hosted by the nonprofit Wikimedia Foundation, set up in 2003. It became one of the most visited websites in the world, written almost entirely by unpaid volunteers.",
 ["Launched 15 January 2001","Written almost entirely by volunteers","Hosted by the nonprofit Wikimedia Foundation since 2003"],
 ["Who started it","Jimmy Wales and Larry Sanger"],"beyond2",
 [["Wikipedia","Neutral point of view: the core content policy","https://en.wikipedia.org/wiki/Wikipedia:Neutral_point_of_view","The principle that holds millions of volunteers together, in their own words.","Primary source"],W("History_of_Wikipedia")],
 ["The Wikipedia Revolution, Andrew Lih","Wikipedia @ 20, Joseph Reagle and Jackie Koerner (eds.)"]);
