name: Link QC (browser)
on:
  workflow_dispatch:
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/qc_browser.mjs tools/qc_browser_urls.txt
