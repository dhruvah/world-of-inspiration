name: Link QC (deep)
on:
  workflow_dispatch:
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/qc_links.py links.txt qc.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: link-qc
          path: qc.tsv
